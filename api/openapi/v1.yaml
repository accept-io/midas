openapi: "3.1.0"
info:
  title: MIDAS API
  version: "1.1.0-rc.1"
  description: >
    Authority governance engine for autonomous decisions.
    Every evaluation produces exactly one outcome and one tamper-evident audit envelope.
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Static bearer token. Configured via MIDAS_AUTH_TOKENS or midas.yaml auth.tokens.
        Not required when auth.mode=open (development only).

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Consequence:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [monetary, risk_rating]
        amount:
          type: number
          description: Monetary amount. Required when type=monetary.
        currency:
          type: string
          description: ISO 4217 currency code. Required when type=monetary.
        risk_rating:
          type: string
          enum: [low, medium, high, critical]
          description: Risk rating value. Required when type=risk_rating.

    EvaluateRequest:
      type: object
      required: [surface_id, agent_id, confidence]
      properties:
        surface_id:
          type: string
          description: ID of the governed decision surface.
        agent_id:
          type: string
          description: ID of the acting agent.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Agent's confidence in the decision (0.0–1.0).
        consequence:
          $ref: "#/components/schemas/Consequence"
        context:
          type: object
          additionalProperties: true
          description: Key-value pairs satisfying the surface's required context keys.
        request_id:
          type: string
          description: Caller-supplied idempotency key. Auto-generated if omitted.
        request_source:
          type: string
          description: Logical source system identifier. Defaults to "api".
        process_id:
          type: string
          description: |
            Process ID for evaluation. Required in enforced structural mode;
            optional in permissive mode (the default).

            MIDAS validates that the process exists, that the surface exists
            (latest version), and that the surface belongs to this process.
            The request fails with 400 if any validation fails.

    EvaluateResponse:
      type: object
      required: [outcome, reason, audit_status]
      properties:
        outcome:
          type: string
          enum: [accept, escalate, reject, request_clarification]
        reason:
          type: string
          description: Typed reason code (e.g. WITHIN_AUTHORITY, CONFIDENCE_BELOW_THRESHOLD).
        envelope_id:
          type: string
          description: ID of the persisted governance envelope. Omitted on simulation.
        explanation:
          type: string
          description: Human-readable explanation of the outcome.
        policy_mode:
          type: string
          description: Active policy evaluator mode (e.g. noop).
        policy_reference:
          type: string
          description: Policy bundle reference used during evaluation.
        policy_skipped:
          type: boolean
          description: True when no policy was attached to the profile.
        simulated:
          type: boolean
          description: True when the result was produced by the non-persistent simulate path.
        audit_status:
          type: string
          enum: [recorded]
          description: >
            Mandatory audit-record marker on successful /v1/evaluate responses
            (D27i-c chunk 3). Constrained to the single value "recorded" in F1 —
            the governed evaluate path always persists a tamper-evident audit
            envelope. Failure responses do not carry this field. The Explorer
            success path emits "explorer_recorded" but is not part of the v1
            public contract; OpenAPI coverage of /explorer is a future tranche.

    ReviewRequest:
      type: object
      required: [envelope_id, decision, reviewer]
      properties:
        envelope_id:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        reviewer:
          type: string
          description: Reviewer identifier.
        notes:
          type: string

    ReviewResponse:
      type: object
      required: [envelope_id, status]
      properties:
        envelope_id:
          type: string
        status:
          type: string

    ResolvedProcessSnapshot:
      type: object
      description: >
        Point-in-time snapshot of the Process the resolved Surface belonged
        to at evaluation time. Captured as evidence on the envelope per
        ADR-0001; not derived from live joins after the envelope is written.
      properties:
        id:
          type: string
        origin:
          type: string
          description: Always "manual" in v1.
        managed:
          type: boolean
        replaces:
          type: string
          description: ID of a previously-superseded Process; empty string when none.
        status:
          type: string
          enum: [active, deprecated]

    ResolvedBusinessServiceSnapshot:
      type: object
      description: >
        Point-in-time snapshot of the BusinessService that owned the
        resolved Process at evaluation time. See ADR-0001.
      properties:
        id:
          type: string
        origin:
          type: string
        managed:
          type: boolean
        replaces:
          type: string
        status:
          type: string
          enum: [active, deprecated]

    ResolvedCapabilitySnapshot:
      type: object
      description: >
        Point-in-time snapshot of one Capability in the BusinessService's
        enabling set at evaluation time. The set as a whole is captured
        as a JSONB array on the envelope; individual entries retain the
        historical Capability ID even if the live row is later renamed
        or deleted.
      properties:
        id:
          type: string
        name:
          type: string
        origin:
          type: string
        managed:
          type: boolean
        replaces:
          type: string
        status:
          type: string
          enum: [active, deprecated]

    ResolvedStructure:
      type: object
      description: >
        Service-led structural context resolved at evaluation time:
        the Process the Surface belongs to, the BusinessService that owns
        the Process, and the set of Capabilities enabling the
        BusinessService at the moment the decision was recorded.
        Empty enabling_capabilities arrays are valid and are serialised
        as `[]` (never `null`). Per ADR-0001.
      properties:
        process:
          $ref: "#/components/schemas/ResolvedProcessSnapshot"
        business_service:
          $ref: "#/components/schemas/ResolvedBusinessServiceSnapshot"
        enabling_capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedCapabilitySnapshot"
          description: >
            Capabilities enabling this BusinessService at evaluation time,
            sorted by id ascending for deterministic byte-level evidence.

    Envelope:
      type: object
      description: Tamper-evident governance record for a single evaluation.
      properties:
        id:
          type: string
        state:
          type: string
          enum: [received, evaluating, outcome_recorded, escalated, awaiting_review, closed]
        surface_id:
          type: string
        agent_id:
          type: string
        request_id:
          type: string
        request_source:
          type: string
        confidence:
          type: number
        outcome:
          type: string
        reason_code:
          type: string
        explanation:
          type: string
        profile_id:
          type: string
        grant_id:
          type: string
        surface_version:
          type: integer
        first_event_hash:
          type: string
        final_event_hash:
          type: string
        resolved:
          type: object
          description: >
            Resolved facts captured at evaluation time. Currently exposes
            the service-led structural context added by ADR-0001; existing
            authority-chain fields remain at the top level for backwards
            compatibility.
          properties:
            structure:
              $ref: "#/components/schemas/ResolvedStructure"
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time

    RuntimeAuditEvent:
      type: object
      description: >
        One audit event in the runtime evidence chain for a governance
        envelope. Returned by GET /v1/evidence/envelopes/{id}/audit-events
        (D30b). The shape mirrors the workbench Explorer audit-event
        response so SIEM and integration consumers can target either
        route with no transform. Payload is returned as recorded; no
        redaction is applied at this endpoint.
      required:
        - id
        - envelope_id
        - request_source
        - request_id
        - sequence_no
        - event_type
        - performer_type
        - performer_id
        - payload
        - occurred_at
        - hash
      properties:
        id:
          type: string
          description: Stable audit-event identifier.
        envelope_id:
          type: string
          description: Envelope this event belongs to.
        request_source:
          type: string
          description: Source system identifier from the originating evaluation.
        request_id:
          type: string
          description: Request identifier from the originating evaluation.
        sequence_no:
          type: integer
          description: 1-based per-envelope sequence number; monotonic in append order.
        event_type:
          type: string
          description: >
            Event-type identifier from the runtime audit chain. The
            set of event types is runtime-internal and intentionally
            not enumerated in this spec; values cover envelope
            lifecycle, evaluation-step, and governance evidence
            events.
        performer_type:
          type: string
          description: Performer category (e.g. system, user, service).
        performer_id:
          type: string
          description: Identifier of the performer that produced the event.
        payload:
          type: object
          description: >
            Event-specific payload as recorded by the runtime. Field
            shape varies per event_type; consumers should treat the
            object as free-form JSON and key off event_type when
            extracting specific fields.
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
          description: When the runtime recorded the event.
        hash:
          type: string
          description: SHA-256 hash of this event in the per-envelope audit chain.
        prev_hash:
          type: string
          description: >
            SHA-256 hash of the previous event in the chain. Omitted
            on the first event of an envelope's chain (sequence_no=1).

    RuntimeAuditEventListResponse:
      type: object
      description: >
        Response wrapper for GET /v1/evidence/envelopes/{id}/audit-events.
        items is always present (empty list for envelopes with no
        events recorded — an operationally-impossible state in
        practice, since every persisted envelope has at least lifecycle
        events). count equals len(items). The endpoint does not
        paginate; audit chains are bounded by evaluation step count.
      required:
        - envelope_id
        - items
        - count
      properties:
        envelope_id:
          type: string
          description: Envelope the chain was retrieved for.
        items:
          type: array
          description: Ordered audit events (SequenceNo ascending).
          items:
            $ref: "#/components/schemas/RuntimeAuditEvent"
        count:
          type: integer
          description: Number of events returned. Equals len(items).

    RuntimeAuditEventSearchResponse:
      type: object
      description: >
        Response wrapper for GET /v1/evidence/audit-events (D30c).
        Cross-envelope search results: items may span multiple
        envelopes, so the wrapper deliberately omits the envelope_id
        field that the per-envelope chain response carries. items is
        always present (empty list is an empty array). count equals
        len(items). The endpoint applies the audit-list default page
        size (100) when limit is unset, capped at the maximum (500).


        D30j adds next_cursor: an opaque pagination token clients
        pass back verbatim as the cursor query parameter to retrieve
        the next page under the same query. The field is absent
        when no further pages exist; clients use field presence as
        the stop signal rather than comparing counts.
      required:
        - items
        - count
      properties:
        items:
          type: array
          description: Audit events matching the filter, ordered by occurred_at per the order query parameter.
          items:
            $ref: "#/components/schemas/RuntimeAuditEvent"
        count:
          type: integer
          description: Number of events returned. Equals len(items).
        next_cursor:
          type: string
          description: >
            Opaque pagination token (D30j). Pass verbatim as the
            cursor query parameter to retrieve the next page under
            the same query. Absent when no further pages exist.
            Bound to the order direction of the originating request:
            replaying a desc-bound cursor against an asc query is
            rejected with 400.

    RuntimeEvidenceIntegrityResponse:
      type: object
      description: >
        Response wrapper for GET /v1/evidence/envelopes/{id}/integrity
        (D30d). Reports the integrity status of the audit-event chain
        for one envelope. `valid` is true only when every check
        passes. On `valid: false`, `error_kind` and `error_message`
        describe the finding; on `valid: true` those fields are
        omitted.


        `first_event_hash` and `final_event_hash` come from the
        observed audit chain (the first and last event's stored
        hashes), not from the envelope's recorded integrity anchors;
        cross-checking those anchors is out of scope for this
        tranche.


        `checked_at` is the timestamp at which the verifier ran. The
        verifier is stateless and can be re-run idempotently.
      required:
        - envelope_id
        - valid
        - chain_length
        - first_event_hash
        - final_event_hash
        - checked_at
      properties:
        envelope_id:
          type: string
          description: Envelope the integrity check was performed on.
        valid:
          type: boolean
          description: True when every chain-integrity check passed; false when an integrity finding is reported.
        chain_length:
          type: integer
          description: Number of audit events observed in the chain. Zero when error_kind is "missing_events".
        first_event_hash:
          type: string
          description: Stored hash of the first audit event in the observed chain. Empty string when the chain is empty.
        final_event_hash:
          type: string
          description: Stored hash of the last audit event in the observed chain. Empty string when the chain is empty.
        checked_at:
          type: string
          format: date-time
          description: UTC timestamp at which the verifier ran.
        error_kind:
          type: string
          description: >
            Stable taxonomy of the integrity finding when `valid` is
            false. One of:
            "missing_events", "sequence_gap", "prev_hash_mismatch",
            "event_hash_mismatch", "terminal_state_mismatch", or
            "unknown" (defensive fallback). Omitted when `valid` is true.
        error_message:
          type: string
          description: Human-readable diagnostic for the integrity finding. Omitted when `valid` is true.

    RuntimeEvidencePacket:
      type: object
      description: >
        Response wrapper for GET /v1/evidence/envelopes/{id}/packet
        (D30e). Composes three existing runtime evidence reads —
        envelope detail, the ordered audit-event chain, and the
        per-envelope integrity verification result — into one
        export-friendly object. Adds no new shapes: each composed
        section uses the same schema as its standalone endpoint.


        Integrity findings are reported in-band via the embedded
        `integrity.valid` field. A `valid: false` result indicates a
        broken audit chain; the packet itself still completed
        successfully and returns HTTP 200. Repository or verification
        read failures produce HTTP 500 — the packet is never returned
        partially.


        `submitted.raw` appears only inside the embedded envelope
        object, preserving the GET /v1/envelopes/{id} contract. The
        wrapper has no top-level submitted / raw / submitted_hash
        field. D30e adds no redaction mode.
      required:
        - envelope_id
        - generated_at
        - envelope
        - audit_events
        - integrity
      properties:
        envelope_id:
          type: string
          description: Envelope the packet was composed for. Matches Envelope.identity.id.
        generated_at:
          type: string
          format: date-time
          description: UTC timestamp at which the handler composed the packet.
        envelope:
          $ref: "#/components/schemas/Envelope"
        audit_events:
          type: array
          description: Ordered audit-event chain for the envelope (SequenceNo ascending). Same item shape as GET /v1/evidence/envelopes/{id}/audit-events.
          items:
            $ref: "#/components/schemas/RuntimeAuditEvent"
        integrity:
          $ref: "#/components/schemas/RuntimeEvidenceIntegrityResponse"

    Surface:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        version:
          type: integer
        domain:
          type: string
        business_owner:
          type: string
        technical_owner:
          type: string
        effective_from:
          type: string
          format: date-time
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        deprecation_reason:
          type: string
        successor_surface_id:
          type: string

    Profile:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        surface_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        effective_date:
          type: string
          format: date-time
        confidence_threshold:
          type: number
        escalation_mode:
          type: string
          enum: [auto, manual]
        escalation_target_id:
          type: string
          description: >
            Optional logical id of an EscalationTarget that should
            receive escalations produced under this profile (D31k-impl-1).
            Empty means no explicit target — the orchestrator preserves
            its existing escalation behaviour. The active version is
            resolved at runtime by the EscalationTarget repository; no
            FK is enforced at the SQL layer. Complementary to
            escalation_mode (auto / manual): mode describes the
            behaviour at escalation time, target describes the
            destination.
        fail_mode:
          type: string
          enum: [open, closed]
          description: >
            Narrow runtime fail-mode for the policy-evaluator-error sub-case
            on this profile. The only currently runtime-effective fail-mode
            field. "open" skips the policy step on evaluator error (the
            canonically-audited narrow exception); "closed" escalates with
            ReasonPolicyError. No other failure path consults this value.
            Future broader fail-mode posture is governed by the FailModePolicy
            entity (planned). The `open` path's audit-event payload currently
            records `allowed:true`; explicit degradation encoding is part of
            the FailModePolicy migration. See
            docs/operations/runtime-readiness.md §11.
        policy_reference:
          type: string
        required_context_keys:
          type: array
          items:
            type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ai, service, operator]
        owner:
          type: string
        model_version:
          type: string
        endpoint:
          type: string
        operational_state:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Grant:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        profile_id:
          type: string
        status:
          type: string
          enum: [active, suspended, revoked]
        granted_by:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApproveSurfaceRequest:
      type: object
      required: [approver_id]
      properties:
        approver_id:
          type: string
        approver_name:
          type: string
        submitted_by:
          type: string
          description: ID of the principal who submitted the surface for review.

    DeprecateSurfaceRequest:
      type: object
      required: [deprecated_by, reason]
      properties:
        deprecated_by:
          type: string
        reason:
          type: string
        successor_id:
          type: string
          description: Optional successor surface ID.

    ApproveProfileRequest:
      type: object
      required: [version, approved_by]
      properties:
        version:
          type: integer
          minimum: 1
        approved_by:
          type: string

    DeprecateProfileRequest:
      type: object
      required: [version, deprecated_by]
      properties:
        version:
          type: integer
          minimum: 1
        deprecated_by:
          type: string

    ApproveGovernanceExpectationRequest:
      type: object
      required: [version, approved_by]
      properties:
        version:
          type: integer
          minimum: 1
        approved_by:
          type: string

    FailModePolicyRule:
      type: object
      description: >
        A single rule binding a correctness class to a three-axis
        runtime-degradation posture (D29b): permitted_mode (Axis A),
        enforcement_state (Axis B), and outcome (Axis C). Validation
        enforces a per-posture matrix of permitted (enforcement_state,
        outcome) combinations; the runtime continues to record the
        resolved policy as evidence only and does not enforce rule
        contents in this tranche.
      required: [correctness_class, permitted_mode]
      properties:
        correctness_class:
          type: string
          enum: [governance_integrity, persistence, input, resource, consistency]
        permitted_mode:
          type: string
          enum: [closed, soft, open, not_applicable]
        enforcement_state:
          type: string
          enum: [evidence_only, dry_run, enforced]
          default: evidence_only
          description: >
            D29b declares the policy posture and intended enforcement
            state. The runtime currently records this declaration as
            evidence only and does not enforce it.
        outcome:
          type: string
          enum: [deny, escalate, permit_with_evidence, manual_review]
          description: >
            Intended outcome for future dry-run or enforced modes. D29b
            stores and validates this declaration only; runtime
            enforcement is not enabled by this schema change.
        reason:
          type: string
          description: Optional free-form note explaining the rule.

    FailModePolicy:
      type: object
      description: >
        Governed, versioned fail-mode policy resource. Lifecycle mirrors
        AuthorityProfile — review-forced apply, approval transitions to
        active, deprecation transitions to deprecated. The persisted
        version is planner-authored at apply time; lifecycle.version on
        the apply document is informational. See
        docs/operations/runtime-readiness.md §11 for the operator-facing
        narrow-fail-mode summary.
      required:
        - id
        - version
        - name
        - status
        - effective_date
        - business_owner
        - technical_owner
        - rules
        - origin
        - managed
        - created_at
        - updated_at
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true
        business_owner:
          type: string
        technical_owner:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/FailModePolicyRule"
        origin:
          type: string
          enum: [manual, inferred]
        managed:
          type: boolean
        replaces:
          type: string
        successor_policy_id:
          type: string
        successor_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
          nullable: true

    ApproveFailModePolicyRequest:
      type: object
      required: [version, approved_by]
      properties:
        version:
          type: integer
          minimum: 1
        approved_by:
          type: string

    DeprecateFailModePolicyRequest:
      type: object
      description: >
        FailModePolicy has no DeprecationReason field on the persisted
        row; the operator-supplied reason is captured in the
        control-audit record only.
      required: [version, deprecated_by]
      properties:
        version:
          type: integer
          minimum: 1
        deprecated_by:
          type: string
        reason:
          type: string

    # ---------------------------------------------------------------
    # FailModePolicy read API (D29d)
    # ---------------------------------------------------------------
    FailModePolicyListResponse:
      type: object
      description: >
        Versions list wrapper for FailModePolicy GET endpoints. The
        array always serialises non-null (empty list when the resource
        is unknown is mapped to 404 by the handler).
      required: [fail_mode_policies]
      properties:
        fail_mode_policies:
          type: array
          items:
            $ref: "#/components/schemas/FailModePolicy"

    # ---------------------------------------------------------------
    # Canonical lifecycle posture
    # ---------------------------------------------------------------
    LifecycleStatus:
      type: string
      description: >
        Canonical lifecycle posture for versioned governance resources
        (Surface, Profile, FailModePolicy, EscalationTarget). Every
        governed configuration entity in MIDAS follows the same
        draft -> review -> active -> deprecated -> retired progression.
        Only `active` versions participate in runtime resolution.
      enum:
        - draft
        - review
        - active
        - deprecated
        - retired

    # ---------------------------------------------------------------
    # EscalationTarget read API (D31k-impl-1)
    # ---------------------------------------------------------------
    EscalationTargetKind:
      type: string
      description: >
        Discriminator for the EscalationTarget Handle field. role =
        identity role name (e.g. governance.approver); agent =
        registered agent id; surface = decision surface id; external =
        external system or URI identifier. Cross-context existence is
        not enforced at the repository layer.
      enum: [role, agent, surface, external]

    EscalationTargetStatus:
      description: >
        Lifecycle state of an EscalationTarget version. Delegates to
        the canonical LifecycleStatus posture. Only `active` versions
        participate in runtime escalation resolution.
      allOf:
        - $ref: "#/components/schemas/LifecycleStatus"

    EscalationTarget:
      type: object
      description: >
        Governed, versioned escalation target. Composite (id, version)
        primary key. The runtime escalation-target resolver picks the
        highest active version whose effective window covers the
        moment of escalation, mirroring FailModePolicy resolution.
      required:
        - id
        - version
        - name
        - kind
        - handle
        - status
        - effective_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/EscalationTargetKind"
        handle:
          type: string
          description: >
            Kind-specific identifier. For role, the role name; for
            agent, the agent id; for surface, the surface id; for
            external, the external system/URI identifier.
        status:
          $ref: "#/components/schemas/EscalationTargetStatus"
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        business_owner:
          type: string
        technical_owner:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
          nullable: true

    EscalationTargetListResponse:
      type: object
      description: >
        List wrapper for EscalationTarget GET endpoints. The array
        always serialises non-null (empty list when no targets exist).
      required: [escalation_targets]
      properties:
        escalation_targets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTarget"

    # ---------------------------------------------------------------
    # DriftDefinition lifecycle (Drift-1e)
    # ---------------------------------------------------------------
    SubmitDriftDefinitionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        submitted_by:
          type: string
          description: Optional body fallback when the authenticated principal is not present.
        reason:
          type: string

    ApproveDriftDefinitionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        approved_by:
          type: string
          description: Optional body fallback when the authenticated principal is not present.

    RejectDriftDefinitionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        rejected_by:
          type: string
        reason:
          type: string

    DeprecateDriftDefinitionRequest:
      type: object
      description: >
        DriftDefinition deprecation request. Successor information is
        optional; when supplied it is persisted on the row's
        successor_definition_id and successor_version fields. The
        operator-supplied reason is captured in the control-audit
        record only.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        deprecated_by:
          type: string
        reason:
          type: string
        successor_definition_id:
          type: string
        successor_version:
          type: integer
          minimum: 0

    RetireDriftDefinitionRequest:
      type: object
      description: >
        DriftDefinition retirement request. Allowed source states:
        draft, review, active, deprecated. Retired is terminal.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        retired_by:
          type: string
        reason:
          type: string

    GrantLifecycleRequest:
      type: object
      properties:
        suspended_by:
          type: string
          description: Required for suspend action.
        revoked_by:
          type: string
          description: Required for revoke action.
        reinstated_by:
          type: string
          description: Required for reinstate action.
        reason:
          type: string

    GrantLifecycleResponse:
      type: object
      required: [grant_id, status, agent_id]
      properties:
        grant_id:
          type: string
        status:
          type: string
          enum: [active, suspended, revoked]
        agent_id:
          type: string

    Capability:
      type: object
      description: >
        A business capability (Phase 1 wire-complete shape). The
        persisted record holds hierarchy (parent_capability_id),
        lifecycle (origin, managed, replaces), audit (created_by), and
        external-system metadata (external_ref) in addition to the
        original identity/status/timestamp fields. Mirrors the
        capabilityResponse wire format. Field nullability conventions
        match aiSystemResponse: parent_capability_id and replaces are
        rendered as null (not omitted) when empty so callers can
        distinguish "absent" from "empty string".
      properties:
        id:
          type: string
          description: Unique capability identifier.
        name:
          type: string
          description: Human-readable capability name.
        description:
          type: string
          description: Optional description. Omitted when empty.
        status:
          type: string
          enum: [active, inactive, deprecated]
        owner:
          type: string
          description: Owner identifier. Omitted when not set.
        parent_capability_id:
          type: string
          nullable: true
          description: >
            Optional parent capability for the hierarchical model. Always
            present in the response; rendered as null when the capability
            is a root (no parent).
        origin:
          type: string
          enum: [manual, inferred]
          description: >
            Lifecycle provenance: `manual` for operator-applied resources,
            `inferred` for system-discovered. Always present.
        managed:
          type: boolean
          description: >
            Lifecycle ownership flag: `true` means the record is fully
            under operator control. `manual` resources are always
            managed=true (DB CHECK enforces). Always present.
        replaces:
          type: string
          nullable: true
          description: >
            Optional capability_id this record supersedes when promoting
            an inferred resource. Always present in the response;
            rendered as null when the capability replaces nothing.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: >
            Optional actor that created the row (e.g. "operator:alice",
            "service-account:ci-bot"). Omitted when empty. Populated by
            the control-plane apply path from the actor passed to
            svc.Apply; absent for capabilities created outside that path
            (seed fixtures, hand-rolled SQL inserts).
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: >
            Optional structured reference to an external system. Always
            present in the response; rendered as null when no external
            reference is recorded. See ExternalRef (Epic 1, PR 3 — Phase
            0B-2 extended the pattern to Capability).

    CapabilityChildrenResponse:
      type: object
      description: >
        Envelope for the children read endpoint
        (GET /v1/capabilities/{id}/children, Phase 3A). Both keys are
        always present. The `capabilities` array contains direct
        children only — recursive descendants are NOT returned. The
        array is empty when the parent has no children.
      required:
        - capability_id
        - capabilities
      properties:
        capability_id:
          type: string
          description: The parent capability identifier.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    CapabilityBusinessServicesResponse:
      type: object
      description: >
        Envelope for the reverse Capability → BusinessService lookup
        (GET /v1/capabilities/{id}/businessservices, Phase 3B). Both
        keys are always present. The `business_services` array
        contains the Business Services directly linked to the
        capability via the canonical BusinessServiceCapability M:N
        junction. Business Services are NOT inferred through
        Processes, Surfaces, or AI bindings. The array is empty when
        the capability has no BSC links. Dangling links (BSC row
        whose business_service_id resolves to a deleted BS) are
        silently skipped, matching governancemap's read-service
        convention.
      required:
        - capability_id
        - business_services
      properties:
        capability_id:
          type: string
          description: The capability identifier.
        business_services:
          type: array
          items:
            $ref: "#/components/schemas/BusinessService"

    CapabilityAIBindingsResponse:
      type: object
      description: >
        Envelope for the Capability-scoped AI bindings endpoint
        (GET /v1/capabilities/{id}/ai-bindings, Phase 3C). Both keys
        are always present. The `bindings` array contains the AI
        System bindings whose `capability_id` matches the path id —
        direct Capability scope only. Bindings that reference the
        capability indirectly (e.g. via a Process whose BS is
        BSC-linked) are NOT inferred. Each binding uses the same
        shape as items in AISystemBindingsResponse, so consumers can
        share the AISystemBinding model across both endpoints.
      required:
        - capability_id
        - bindings
      properties:
        capability_id:
          type: string
          description: The capability identifier.
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/AISystemBinding"

    Process:
      type: object
      properties:
        id:
          type: string
          description: Unique process identifier.
        name:
          type: string
          description: Human-readable process name.
        capability_id:
          type: string
          description: ID of the parent capability.
        description:
          type: string
          description: Optional description. Omitted when empty.
        status:
          type: string
          enum: [active, inactive, deprecated]
        owner:
          type: string
          description: Owner identifier. Omitted when not set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # ExternalRef shared metadata (Epic 1, PR 3)
    # ------------------------------------------------------------------

    ExternalRef:
      type: object
      description: >
        Structured reference to an entity in an external system
        (ServiceNow, LeanIX, GitHub, internal catalogues, custom). MIDAS
        records the reference but never validates the source_system
        against an enum and never resolves the reference by calling the
        external system. source_system and source_id must either both
        be present or both be absent — the consistency rule is enforced
        by a CHECK constraint on each consuming table. Wire-format
        nullability: the parent response renders `external_ref: null`
        when no external reference is recorded.
      required:
        - source_system
        - source_id
      properties:
        source_system:
          type: string
          description: |
            Caller-asserted label identifying the external system that
            produced this reference. Vendor-neutral; MIDAS does not
            validate or resolve this value.
        source_id:
          type: string
          description: Identifier of the entity in the source system.
        source_url:
          type: string
          description: Optional deep link to the entity in the source system.
        source_version:
          type: string
          description: Optional version label assigned by the source system.
        last_synced_at:
          type: string
          format: date-time
          description: Optional timestamp of the last sync from the source system.

    BusinessService:
      type: object
      description: >
        A business service grouping for processes (V2 structural layer).
        Mirrors the businessServiceResponse wire format.
      properties:
        id:
          type: string
          description: Unique business service identifier.
        name:
          type: string
          description: Human-readable business service name.
        description:
          type: string
          description: Optional description. Omitted when empty.
        service_type:
          type: string
          description: Service classification (e.g. customer_facing, internal).
        regulatory_scope:
          type: string
          description: Regulatory scope marker. Omitted when empty.
        status:
          type: string
          enum: [active, inactive, deprecated]
        owner_id:
          type: string
          description: >
            Optional owner identifier (team, person, or organisational unit).
            Omitted when empty. Surfaced on detail and list responses for
            operator triage (added with the live BS selector).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: >
            Optional structured reference to an external system. Always
            present in the response; rendered as null when no external
            reference is recorded (Epic 1, PR 3).
        fail_mode_policy_id:
          type: string
          description: >
            Optional default FailModePolicy identifier for this business
            service (D27j-impl-2). When set, processes/surfaces under
            this BusinessService inherit this policy unless the surface
            declares its own override. Validated at apply time: must
            reference a FailModePolicy whose status is `active` at the
            time of apply. Omitted when no default is configured. In
            this tranche the resolver records the policy as observability
            metadata only — it does not affect outcomes or appear in the
            /v1/evaluate response.

    BusinessServicesResponse:
      type: object
      description: >
        Envelope wrapping the GET /v1/businessservices list payload. The
        `business_services` array is always present (never null); empty
        store returns []. The envelope shape replaced the previous bare
        array when the live Explorer Business-Service selector landed.
      required: [business_services]
      properties:
        business_services:
          type: array
          items:
            $ref: "#/components/schemas/BusinessService"

    BusinessServiceRelationship:
      type: object
      description: >
        A directed link between two BusinessServices (Epic 1, PR 1). The
        junction has no lifecycle of its own; description is the only
        mutable field.
      required: [id, source_business_service_id, target_business_service_id, relationship_type, created_at]
      properties:
        id:
          type: string
          description: Synthetic relationship identifier.
        source_business_service_id:
          type: string
        target_business_service_id:
          type: string
        relationship_type:
          type: string
          enum: [depends_on, supports, part_of]
        description:
          type: string
          description: Optional. Omitted when empty.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Optional. Actor that created the row.
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: Optional structured external reference. See ExternalRef (Epic 1, PR 3).

    BusinessServiceRelationshipsResponse:
      type: object
      description: >
        Top-level response shape for GET /v1/businessservices/{id}/relationships.
        Outgoing rows are those where the queried service is the source;
        incoming rows are those where it is the target. Both arrays are
        always present (never null).
      required: [business_service_id, outgoing, incoming]
      properties:
        business_service_id:
          type: string
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/BusinessServiceRelationship"
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/BusinessServiceRelationship"

    # ------------------------------------------------------------------
    # Context Graph (D31d — graphs family taxonomy)
    # ------------------------------------------------------------------
    #
    # Generic node/edge projection rooted at a single entity. D31d
    # only emits the kinds documented under the `enum` lists below.
    # Forbidden Phase 1 kinds (authority_profile, authority_grant,
    # agent, ai_system_version, governed_by, has_grant, granted_to,
    # has_active_version) are not in the enums and never appear on the
    # wire.

    ContextGraphNodeRef:
      type: object
      description: >
        (kind, id) pair uniquely identifying a node within a single
        projection.
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          description: Node kind (one of the ContextGraphNode kinds).
        id:
          type: string
          description: Entity identifier within its kind.

    ContextGraphNode:
      type: object
      description: >
        One projected entity. Phase 1 fields (kind, id, label) are
        always populated. Phase 2A adds typed per-kind data pointers
        — exactly one is populated per node and matches the node's
        kind. Unused pointers are omitted from the wire payload, so a
        node carries only its kind's data block. There is no generic
        attrs map.
      required:
        - kind
        - id
        - label
      properties:
        kind:
          type: string
          enum:
            - business_service
            - related_business_service
            - capability
            - process
            - decision_surface
            - ai_system
            - ai_system_binding
            - authority_summary
            - coverage
        id:
          type: string
          description: Entity identifier within its kind. Synthetic
            kinds (authority_summary, coverage) use the form
            `<kind>:<business_service_id>`.
        label:
          type: string
          description: Human-readable display name.
        # Typed per-kind data. Exactly one is populated per node and
        # matches `kind`; the rest are omitted from the wire payload.
        business_service:
          $ref: "#/components/schemas/ContextGraphBusinessServiceData"
        related_business_service:
          $ref: "#/components/schemas/ContextGraphRelatedBusinessServiceData"
        capability:
          $ref: "#/components/schemas/ContextGraphCapabilityData"
        process:
          $ref: "#/components/schemas/ContextGraphProcessData"
        decision_surface:
          $ref: "#/components/schemas/ContextGraphDecisionSurfaceData"
        ai_system:
          $ref: "#/components/schemas/ContextGraphAISystemData"
        ai_system_binding:
          $ref: "#/components/schemas/ContextGraphAISystemBindingData"
        authority_summary:
          $ref: "#/components/schemas/ContextGraphAuthoritySummaryData"
        coverage:
          $ref: "#/components/schemas/ContextGraphCoverageData"

    ContextGraphEdge:
      type: object
      description: >
        One directed link in the projection. Direction is encoded as
        (src → dst) per the kind contract documented on
        /v1/graphs/context.
      required:
        - kind
        - src
        - dst
      properties:
        kind:
          type: string
          enum:
            - relates_to
            - has_capability
            - has_process
            - has_surface
            - bound_to
            - system_of
            - summarises
            - reports_coverage
        src:
          $ref: "#/components/schemas/ContextGraphNodeRef"
        dst:
          $ref: "#/components/schemas/ContextGraphNodeRef"
        label:
          type: string
          description: >
            Optional human-readable description. Omitted (rather than
            empty) when not populated. Phase 1 emits no edge labels;
            reserved for the inline edge explanation epic.

    ContextGraphProjection:
      type: object
      description: >
        Top-level response shape for GET /v1/graphs/context. Nodes are
        sorted by (kind, id) ascending; edges are sorted by
        (kind, src.kind, src.id, dst.kind, dst.id) ascending. Both
        arrays are always present (never null); an empty depth=0
        projection still carries the root in `nodes`.
      required:
        - root
        - view
        - depth
        - nodes
        - edges
      properties:
        root:
          $ref: "#/components/schemas/ContextGraphNodeRef"
        view:
          type: string
          enum: [service, ai_system, decision_surface]
          description: >
            Perspective the projection was computed in. `service`
            projects from a business-service root via the
            governance-map read service. `ai_system` projects from an
            AI-system root by walking bindings to their scope targets.
            `decision_surface` projects from a surface root and emits
            its parent process / business service plus AI systems
            bound directly to the surface. Future views (agent, risk)
            are reserved.
        depth:
          type: integer
          minimum: 0
          maximum: 5
          description: >
            Effective depth (BFS hops from root, undirected) used to
            compute the projection. Equals the requested depth when in
            range, or the silent clamp value (5) when the request
            exceeded the maximum.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ContextGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ContextGraphEdge"

    # ------------------------------------------------------------------
    # Context Graph per-kind typed data
    # ------------------------------------------------------------------
    #
    # Each schema carries the typed information for one node kind. The
    # field set mirrors the equivalent governance-map DTO for the
    # fields available on the underlying domain type. There is NO
    # generic attrs map — every projected datum is a typed field.

    ContextGraphExternalRefData:
      type: object
      description: >
        External reference structure mirroring the governance-map
        external_ref wire shape (httpapi.externalRefResponse). Same
        field names and JSON tags so consumers can share parsing
        logic across both endpoints.
      required:
        - source_system
        - source_id
      properties:
        source_system:
          type: string
        source_id:
          type: string
        source_url:
          type: string
        source_version:
          type: string
        last_synced_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.

    ContextGraphBusinessServiceData:
      type: object
      description: >
        Typed data for a node of kind `business_service`. Mirrors the
        governance-map businessService DTO for the fields available on
        the businessservice.BusinessService domain type.
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        service_type:
          type: string
          description: >
            Classification of the service (e.g. customer_facing,
            internal, technical). Mirrors the governance-map
            business_service.service_type field.
        regulatory_scope:
          type: string
          description: >
            Free-form regulatory-scope label. Mirrors the
            governance-map business_service.regulatory_scope field.
        fail_mode_policy_id:
          type: string
          description: >
            Optional logical reference to a closed-only FailModePolicy
            that supplies the default fail-mode posture for surfaces
            under this service when those surfaces have no explicit
            override. Empty / omitted when unset. Apply-time validation
            rejects references to missing, review, deprecated, or
            retired policies. The projection carries the reference
            verbatim — no policy lookup or rule inspection is performed
            on the read path.
        external_ref:
          $ref: "#/components/schemas/ContextGraphExternalRefData"

    ContextGraphRelatedBusinessServiceData:
      type: object
      description: >
        Typed data for a node of kind `related_business_service`. One
        node is emitted per related-BS id, even when the same other-BS
        appears in both outgoing and incoming relationships (the
        schema's uniq_bsr_triple constraint allows root↔X via two
        distinct rows). Direction is *implicit* in which sub-row
        pointer is non-nil — `outgoing` for root → related, `incoming`
        for related → root. At least one of the two sub-rows is
        populated; both may be populated for bidirectional cases.
      required:
        - id
      properties:
        id:
          type: string
          description: Related business service id (= the "other" BS).
        name:
          type: string
        outgoing:
          $ref: "#/components/schemas/ContextGraphRelatedBusinessServiceRow"
        incoming:
          $ref: "#/components/schemas/ContextGraphRelatedBusinessServiceRow"

    ContextGraphRelatedBusinessServiceRow:
      type: object
      description: >
        Per-direction relationship row data carried on a
        `related_business_service` node. Mirrors the governance-map
        relationship DTO's per-row fields for the fields available on
        the businessservice.BusinessServiceRelationship domain type.
      required:
        - relationship_id
        - relationship_type
      properties:
        relationship_id:
          type: string
          description: The relationship row id from
            business_service_relationships.
        relationship_type:
          type: string
          description: e.g. depends_on, supports, part_of
        description:
          type: string

    ContextGraphCapabilityData:
      type: object
      description: Typed data for a node of kind `capability`.
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        parent_capability_id:
          type: string
        external_ref:
          $ref: "#/components/schemas/ContextGraphExternalRefData"

    ContextGraphProcessData:
      type: object
      description: >
        Typed data for a node of kind `process`. The process domain
        type does not currently carry an external_ref field, so this
        struct has no external_ref attribute. If the domain gains it,
        the schema will be extended additively.
      required:
        - id
        - name
        - status
        - business_service_id
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        business_service_id:
          type: string

    ContextGraphDecisionSurfaceData:
      type: object
      description: >
        Typed data for a node of kind `decision_surface`. The two
        binding-id arrays are non-nil (possibly empty) and disjoint
        per the governance-map contract.
      required:
        - id
        - version
        - name
        - status
        - process_id
        - ai_binding_ids
        - inherited_ai_binding_ids
        - profile_count
        - grant_count
        - agent_count
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
        process_id:
          type: string
        fail_mode_policy_id:
          type: string
          description: >
            Optional surface-level FailModePolicy override. Empty /
            omitted when unset; runtime resolution then falls back to
            the parent BusinessService's `fail_mode_policy_id`.
            Apply-time validation rejects references to missing,
            review, deprecated, or retired policies. The projection
            carries the reference verbatim — no policy lookup or rule
            inspection is performed on the read path.
        ai_binding_ids:
          type: array
          items:
            type: string
        inherited_ai_binding_ids:
          type: array
          items:
            type: string
        profile_count:
          type: integer
        grant_count:
          type: integer
        agent_count:
          type: integer

    ContextGraphAISystemData:
      type: object
      description: >
        Typed data for a node of kind `ai_system`. `active_version`,
        `active_version_label`, and `active_version_status` are
        populated when the AI system has an active version on the
        governance map, omitted otherwise.
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        vendor:
          type: string
        system_type:
          type: string
        active_version:
          type: integer
          description: The integer version number of the active
            AISystemVersion. Omitted when no active version exists.
        active_version_label:
          type: string
          description: Optional release label associated with the
            active version.
        active_version_status:
          type: string
          description: Status of the active AISystemVersion (e.g.
            draft, active, retired). Mirrors the governance-map
            ai_systems[].active_version.status field.
        external_ref:
          $ref: "#/components/schemas/ContextGraphExternalRefData"

    ContextGraphAISystemBindingData:
      type: object
      description: >
        Typed data for a node of kind `ai_system_binding`. The four
        scope-id pointers mirror the governance-map binding DTO;
        `scope_kind` / `scope_id` / `scope_label` record the
        most-specific scope (matching the bound_to edge target and
        the node label format `binding: <ai_system> → <scope>`).
      required:
        - id
        - ai_system_id
        - business_service_id
        - capability_id
        - process_id
        - surface_id
        - scope_kind
        - scope_id
        - scope_label
      properties:
        id:
          type: string
        ai_system_id:
          type: string
        ai_system_name:
          type: string
        business_service_id:
          type: string
          nullable: true
        capability_id:
          type: string
          nullable: true
        process_id:
          type: string
          nullable: true
        surface_id:
          type: string
          nullable: true
        role:
          type: string
          description: >
            Optional role marker on the binding (e.g. primary,
            shadow). Mirrors the governance-map binding.role field.
        description:
          type: string
          description: >
            Optional free-form description. Mirrors the
            governance-map binding.description field.
        scope_kind:
          type: string
          description: One of decision_surface, process, capability,
            business_service. Always set unless the binding has no
            scope (which the schema's chk_ai_bindings_at_least_one_target
            prevents at apply time).
        scope_id:
          type: string
        scope_label:
          type: string
          description: Human-readable token in the form
            `<short_kind>:<id>` (e.g. `surface:surf-x`). `unscoped`
            when no scope is set.

    ContextGraphAuthoritySummaryData:
      type: object
      description: >
        Typed data for the synthetic `authority_summary` node.
        Mirrors the governance-map AuthoritySummary DTO field-for-field
        so the values are directly comparable across both endpoints.
      required:
        - surface_count
        - active_profile_count
        - active_grant_count
        - active_agent_count
      properties:
        surface_count:
          type: integer
        active_profile_count:
          type: integer
        active_grant_count:
          type: integer
        active_agent_count:
          type: integer

    ContextGraphCoverageData:
      type: object
      description: >
        Typed data for the synthetic `coverage` node. Mirrors the
        governance-map Coverage DTO (Phase 9 explicit field naming);
        the three AI-binding counters are mutually exclusive at the
        surface level and sum to surface_count by construction.
      required:
        - surface_count
        - surfaces_with_direct_ai_binding
        - surfaces_with_scoped_ai_binding
        - surfaces_with_no_ai_binding
      properties:
        surface_count:
          type: integer
        surfaces_with_direct_ai_binding:
          type: integer
        surfaces_with_scoped_ai_binding:
          type: integer
        surfaces_with_no_ai_binding:
          type: integer

    # ------------------------------------------------------------------
    # Authority Graph (D31f — distinct from Context Graph)
    # ------------------------------------------------------------------
    #
    # Generic node/edge projection rooted at a business service. Six
    # MVP node kinds (business_service, decision_surface,
    # authority_profile, authority_grant, agent, fail_mode_policy)
    # and six edge kinds wire the authority spine plus fail-mode
    # policy references.

    AuthorityGraphNodeRef:
      type: object
      description: >
        Reference to a node by its (kind, id) pair. Used by edge
        endpoints and the projection root.
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          description: Node kind (one of the AuthorityGraphNode kinds).
          enum:
            - business_service
            - decision_surface
            - authority_profile
            - authority_grant
            - agent
            - fail_mode_policy
        id:
          type: string

    AuthorityGraphNode:
      type: object
      description: >
        One entity in the projected Authority Graph. Exactly one
        typed-data slot is populated per node, matched to kind.
        Unused slots are omitted from the wire payload via
        omitempty so a node serialises to a compact shape with
        only its kind's data block.
      required:
        - kind
        - id
        - label
      properties:
        kind:
          type: string
          enum:
            - business_service
            - decision_surface
            - authority_profile
            - authority_grant
            - agent
            - fail_mode_policy
            - escalation_target
        id:
          type: string
        label:
          type: string
        business_service:
          $ref: "#/components/schemas/AuthorityGraphBusinessServiceData"
        decision_surface:
          $ref: "#/components/schemas/AuthorityGraphDecisionSurfaceData"
        authority_profile:
          $ref: "#/components/schemas/AuthorityGraphAuthorityProfileData"
        authority_grant:
          $ref: "#/components/schemas/AuthorityGraphAuthorityGrantData"
        agent:
          $ref: "#/components/schemas/AuthorityGraphAgentData"
        fail_mode_policy:
          $ref: "#/components/schemas/AuthorityGraphFailModePolicyData"
        escalation_target:
          $ref: "#/components/schemas/AuthorityGraphEscalationTargetData"

    AuthorityGraphEdge:
      type: object
      description: >
        One directed link in the Authority Graph. Direction is
        encoded as (src → dst) per the kind contract documented on
        /v1/graphs/authority. The fail-mode-policy edges carry a
        label of "default" (BS-level) or "override" (surface-level);
        other edge kinds leave label empty.
      required:
        - kind
        - src
        - dst
      properties:
        kind:
          type: string
          enum:
            - business_service_has_surface
            - surface_uses_profile
            - profile_has_grant
            - grant_authorises_agent
            - surface_has_fail_mode_policy
            - business_service_has_fail_mode_policy
            - profile_escalates_to
        src:
          $ref: "#/components/schemas/AuthorityGraphNodeRef"
        dst:
          $ref: "#/components/schemas/AuthorityGraphNodeRef"
        label:
          type: string
          description: >
            For fail-mode-policy edges, one of "default" or
            "override". Empty for other kinds.

    AuthorityGraphProjection:
      type: object
      description: >
        Top-level response shape for GET /v1/graphs/authority. Nodes
        are sorted by (kind, id) ascending; edges are sorted by
        (kind, src.kind, src.id, dst.kind, dst.id) ascending. Both
        arrays are always present (never null); an empty depth=0
        projection still carries the root in `nodes`.


        D31g adds `summary` and `diagnostics`. Both are optional on
        the wire (omitempty when empty) and describe the FULL pre-
        depth-filter projection — they remain meaningful at depth=0.
      required:
        - root
        - view
        - depth
        - nodes
        - edges
      properties:
        root:
          $ref: "#/components/schemas/AuthorityGraphNodeRef"
        view:
          type: string
          enum: [service]
          description: >
            Perspective the projection was computed in. MVP supports
            only `service`.
        depth:
          type: integer
          description: >
            Maximum BFS hops from the root applied to this
            projection. May differ from the request's depth when the
            caller-supplied value was silently clamped to MaxDepth.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphEdge"
        summary:
          $ref: "#/components/schemas/AuthorityGraphSummary"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphDiagnostic"
          description: >
            Operator-actionable conditions observed during projection.
            Sorted by (severity rank, kind, first node ref). Severity
            rank is critical < warning < info.
        diagnostic_summary:
          $ref: "#/components/schemas/AuthorityGraphDiagnosticSummary"
        surface_posture:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphSurfaceAuthorityPosture"
          description: >
            Per-surface authority posture rollup (D31m). One entry per
            emitted active decision surface, sorted by surface id
            ascending. Describes the FULL pre-depth-filter projection —
            depth=0 callers still see posture for every surface.

    AuthorityGraphDiagnosticSeverity:
      type: string
      description: Operator-facing severity for diagnostics.
      enum:
        - info
        - warning
        - critical

    AuthorityGraphDiagnosticKind:
      type: string
      description: Operator-facing diagnostic vocabulary.
      enum:
        - business_service_has_no_active_surface
        - surface_has_no_active_profile
        - profile_has_no_active_grant
        - grant_references_missing_agent
        - grant_references_inactive_agent
        - fail_mode_policy_reference_dangling
        - surface_inherits_business_service_policy
        - surface_overrides_business_service_default
        - surface_override_matches_business_service_default
        - profile_future_dated
        - profile_expired
        - grant_future_dated
        - grant_expired
        - duplicate_active_profile_versions_for_surface
        - grant_has_no_capabilities
        - profile_has_no_escalation_target
        - escalation_target_reference_dangling

    AuthorityGraphDiagnostic:
      type: object
      description: >
        One operator-actionable condition observed during projection.
        node_refs identifies the entities the diagnostic applies to
        (most-specific entity first, supporting context refs trailing).
      required:
        - kind
        - severity
      properties:
        kind:
          $ref: "#/components/schemas/AuthorityGraphDiagnosticKind"
        severity:
          $ref: "#/components/schemas/AuthorityGraphDiagnosticSeverity"
        node_refs:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
        message:
          type: string

    AuthorityGraphValidityStatus:
      type: string
      description: >
        Time-window classification an authority profile or grant
        carries on its typed data. Emitted nodes always carry
        "effective"; future-dated and expired entities are filtered
        out of the node set and produce diagnostics instead.
      enum:
        - effective
        - future_dated
        - expired

    AuthorityGraphEffectivePolicySource:
      type: string
      description: >
        Resolved fail-mode-policy origin per decision surface.
        "override" — the surface had a non-empty FailModePolicyID
        that resolved to an active version. "business_service_default"
        — the surface inherits from the BS-level default (surface
        had no override OR its override was dangling). "none" — no
        effective fail-mode policy resolves for this surface.
      enum:
        - override
        - business_service_default
        - none

    AuthorityGraphSummary:
      type: object
      description: >
        Backend-computed posture rollup for a service-view Authority
        Graph projection. Count fields are always present;
        per-entity gap lists use omitempty. Summary describes the
        FULL pre-depth-filter projection — operators at depth=0
        still see the authority posture.
      required:
        - surface_count
        - active_profile_count
        - active_grant_count
        - active_agent_count
        - fail_mode_policy_count
        - complete_authority_paths
        - incomplete_authority_paths
        - surfaces_with_policy_override
        - surfaces_inheriting_bs_policy
        - grants_with_stop_capability
        - grants_with_constraints
        - escalation_target_count
        - profiles_with_escalation_target
      properties:
        surface_count:
          type: integer
        active_profile_count:
          type: integer
        active_grant_count:
          type: integer
        active_agent_count:
          type: integer
        fail_mode_policy_count:
          type: integer
        complete_authority_paths:
          type: integer
          description: >
            Surfaces with at least one effective profile → effective
            grant → resolved agent chain. Counted per surface, not
            per chain.
        incomplete_authority_paths:
          type: integer
          description: >
            Emitted surfaces with no complete authority path.
        surfaces_without_profiles:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
        profiles_without_grants:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
        grants_without_agents:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
        surfaces_without_effective_fail_mode_policy:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
        surfaces_with_policy_override:
          type: integer
        surfaces_inheriting_bs_policy:
          type: integer
        policies_missing_active_version:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
          description: >
            Deduped fail-mode-policy NodeRefs that were referenced
            (at BS or surface level) but had no active version. The
            entries are NodeRefs even though no fail_mode_policy
            node is emitted for them.
        grants_with_stop_capability:
          type: integer
          description: >
            Count of emitted authority_grant nodes whose
            capabilities slice contains "stop".
        grants_with_constraints:
          type: integer
          description: >
            Count of emitted authority_grant nodes that carry at
            least one Constraint.
        grants_without_capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
          description: >
            Emitted grants that carry zero Capabilities. Paired
            with the grant_has_no_capabilities warning diagnostic.
        escalation_target_count:
          type: integer
          description: >
            Count of deduped escalation_target nodes emitted in the
            full pre-depth-filter projection (D31l).
        profiles_with_escalation_target:
          type: integer
          description: >
            Count of effective profiles whose EscalationTargetID
            resolved to an active escalation target.
        profiles_without_escalation_target:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
          description: >
            Effective profiles with an empty EscalationTargetID.
            Paired with the profile_has_no_escalation_target info
            diagnostic.
        profiles_with_dangling_escalation_target:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphNodeRef"
          description: >
            Effective profiles whose configured EscalationTargetID
            did not resolve to an active target. Paired with the
            escalation_target_reference_dangling warning diagnostic.

    # ---------------------------------------------------------------
    # D31m — DiagnosticSummary + SurfaceAuthorityPosture
    # ---------------------------------------------------------------

    AuthorityGraphSeverityRollupValue:
      type: string
      description: >
        Severity-rollup vocabulary used by DiagnosticSummary.highest_severity
        and SurfaceAuthorityPosture.highest_severity. The three non-"none"
        values share string identity with AuthorityGraphDiagnosticSeverity.
      enum:
        - none
        - info
        - warning
        - critical

    AuthorityGraphDiagnosticSummary:
      type: object
      description: >
        Per-severity rollup over the full pre-depth diagnostics
        array (D31m). Counts sum to len(diagnostics). highest_severity
        is "none" when the array is empty, otherwise the most-severe
        present (critical > warning > info). by_kind is omitted when
        no diagnostics exist.
      required:
        - info
        - warning
        - critical
        - highest_severity
      properties:
        info:
          type: integer
        warning:
          type: integer
        critical:
          type: integer
        highest_severity:
          $ref: "#/components/schemas/AuthorityGraphSeverityRollupValue"
        by_kind:
          type: object
          additionalProperties:
            type: integer
          description: >
            Per-diagnostic-kind count. Keys are AuthorityGraphDiagnosticKind
            values. Omitted when no diagnostics are present.

    AuthorityGraphAuthorityStatus:
      type: string
      description: >
        Surface-level authority posture roll-up. Precedence
        (worst → best): uncovered > incomplete > degraded > complete.
        Info-only diagnostics do NOT degrade a complete surface.
      enum:
        - complete
        - incomplete
        - degraded
        - uncovered

    AuthorityGraphProfileStatus:
      type: string
      description: >
        Surface-level profile coverage. "covered" when at least one
        effective profile attaches to the surface; "missing" otherwise.
      enum:
        - covered
        - missing

    AuthorityGraphGrantStatus:
      type: string
      description: >
        Surface-level grant coverage. "covered" when at least one
        effective profile under the surface has at least one effective
        grant; "missing" otherwise.
      enum:
        - covered
        - missing

    AuthorityGraphAgentStatus:
      type: string
      description: >
        Surface-level agent coverage. Precedence: blocked > missing >
        covered. "blocked" when any grant under the surface fires a
        critical missing/inactive-agent diagnostic; "covered" when at
        least one complete path resolves with an active agent;
        "missing" when profiles/grants exist but no agent resolves.
      enum:
        - covered
        - missing
        - blocked

    AuthorityGraphFailModePolicyStatus:
      type: string
      description: >
        Surface-level fail-mode posture. "override" — surface's own
        FailModePolicyID resolved. "inherited" — BS default supplies
        the effective policy. "missing" — no effective policy at any
        level. "dangling" — any non-empty policy reference (surface
        override or BS default) failed to resolve. Dangling wins over
        inherited and missing.
      enum:
        - override
        - inherited
        - missing
        - dangling

    AuthorityGraphEscalationStatus:
      type: string
      description: >
        Surface-level escalation routing posture. "targeted" — at
        least one effective profile under the surface references an
        active EscalationTarget. "not_targeted" — no profile has an
        explicit target. "dangling" — at least one profile references
        a target id that does not resolve. Dangling wins over targeted.
      enum:
        - targeted
        - not_targeted
        - dangling

    AuthorityGraphSurfaceAuthorityPosture:
      type: object
      description: >
        Per-surface authority posture (D31m). One record per emitted
        active decision surface in the FULL pre-depth-filter
        projection. Frontends consume this to render per-surface
        health without walking edges or interpreting diagnostics.
      required:
        - surface
        - authority_status
        - profile_status
        - grant_status
        - agent_status
        - fail_mode_policy_status
        - escalation_status
        - complete_paths
        - incomplete_paths
        - highest_severity
      properties:
        surface:
          $ref: "#/components/schemas/AuthorityGraphNodeRef"
        authority_status:
          $ref: "#/components/schemas/AuthorityGraphAuthorityStatus"
        profile_status:
          $ref: "#/components/schemas/AuthorityGraphProfileStatus"
        grant_status:
          $ref: "#/components/schemas/AuthorityGraphGrantStatus"
        agent_status:
          $ref: "#/components/schemas/AuthorityGraphAgentStatus"
        fail_mode_policy_status:
          $ref: "#/components/schemas/AuthorityGraphFailModePolicyStatus"
        escalation_status:
          $ref: "#/components/schemas/AuthorityGraphEscalationStatus"
        complete_paths:
          type: integer
        incomplete_paths:
          type: integer
        highest_severity:
          $ref: "#/components/schemas/AuthorityGraphSeverityRollupValue"
        diagnostic_kinds:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityGraphDiagnosticKind"
          description: >
            Unique diagnostic kinds whose NodeRefs associate with this
            surface (direct surface ref, or profile/grant/agent ref
            anchored to this surface). Sorted alphabetically.

    AuthorityGraphBusinessServiceData:
      type: object
      description: Typed data for a business_service node.
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        owner:
          type: string
        service_type:
          type: string
        external_ref:
          $ref: "#/components/schemas/AuthorityGraphExternalRefData"
        fail_mode_policy_id:
          type: string
          description: >
            Optional reference to a FailModePolicy logical id used as
            the BS-level default. The projection emits a separate
            fail_mode_policy node and business_service_has_fail_mode_policy
            edge when this reference resolves to an active version.

    AuthorityGraphDecisionSurfaceData:
      type: object
      description: >
        Typed data for a decision_surface node.

        D31g adds resolved fail-mode-policy metadata
        (effective_policy_source, effective_policy_id,
        effective_policy_version, inherits_bs_policy). Operators
        see at a glance whether a surface has an explicit override,
        inherits the BS-level default, or has no effective policy.

        business_service_id
        is derived during projection from the parent process; the
        surface domain type does not own a BS pointer directly.
        process_id is carried for traceability even though the
        Authority Graph collapses process traversal into the
        BS → Surface edge.
      required:
        - id
        - version
        - name
        - status
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        status:
          type: string
        process_id:
          type: string
        business_service_id:
          type: string
        fail_mode_policy_id:
          type: string
          description: >
            Optional reference to a FailModePolicy logical id used as
            a surface-level override. The projection emits a separate
            fail_mode_policy node and surface_has_fail_mode_policy
            edge when this reference resolves to an active version.
        effective_policy_source:
          $ref: "#/components/schemas/AuthorityGraphEffectivePolicySource"
        effective_policy_id:
          type: string
          description: >
            Resolved fail-mode policy id. Set when effective_policy_source
            is "override" (= surface override) or "business_service_default"
            (= BS-level fallback). Empty when source is "none".
        effective_policy_version:
          type: integer
          description: >
            Resolved policy version corresponding to effective_policy_id.
        inherits_bs_policy:
          type: boolean
          description: >
            True when the surface inherits the BS-level default
            (either because it has no override or its override is
            dangling and BS-default is available). False when the
            surface has its own override OR no effective policy at
            all.

    AuthorityGraphConsequenceThreshold:
      type: object
      description: >
        Typed value object representing an authority profile's
        consequence threshold. Exactly one variant is populated
        based on type — monetary (amount + currency) or risk_rating
        (risk_rating). Mirrors authority.Consequence.
      required:
        - type
      properties:
        type:
          type: string
          description: Either "monetary" or "risk_rating".
        amount:
          type: number
        currency:
          type: string
        risk_rating:
          type: string

    AuthorityGraphAuthorityProfileData:
      type: object
      description: >
        Typed data for an authority_profile node. Includes lifecycle
        fields (status, effective_date, approved_by/at) plus the
        runtime-relevant configuration (thresholds, escalation_mode,
        fail_mode, policy_reference).
      required:
        - id
        - version
        - surface_id
        - name
        - status
        - confidence_threshold
      properties:
        id:
          type: string
        version:
          type: integer
        surface_id:
          type: string
        name:
          type: string
        status:
          type: string
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          description: >
            Validity-window upper bound. Profile is no longer
            effective at or after this instant.
        validity_status:
          $ref: "#/components/schemas/AuthorityGraphValidityStatus"
        confidence_threshold:
          type: number
        consequence_threshold:
          $ref: "#/components/schemas/AuthorityGraphConsequenceThreshold"
        escalation_mode:
          type: string
        fail_mode:
          type: string
        policy_reference:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        escalation_target_id:
          type: string
          description: >
            Configured EscalationTargetID carried verbatim from the
            domain (D31l). Empty when the profile has no explicit
            target. The resolved active target — if any — appears as
            a separate escalation_target node + profile_escalates_to
            edge.

    AuthorityGraphAuthorityGrantData:
      type: object
      description: >
        Typed data for an authority_grant node. Grant references the
        profile by logical id (not by version). Noisy lifecycle
        fields (suspend/revoke metadata, GrantReason) are
        intentionally excluded from the graph wire shape.


        D31i adds `capabilities` and `constraints`. Capabilities is
        the SET of canonical Capability values the grant authorises
        (omitempty when empty — the projection also emits a
        grant_has_no_capabilities warning diagnostic). Constraints
        is the typed list of grant constraints (omitempty when
        empty).
      required:
        - id
        - profile_id
        - agent_id
        - status
      properties:
        id:
          type: string
        profile_id:
          type: string
        agent_id:
          type: string
        status:
          type: string
        effective_date:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        validity_status:
          $ref: "#/components/schemas/AuthorityGraphValidityStatus"
        granted_by:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityCapability"
          description: >
            The SET of authority Capability values this grant
            authorises. Empty / omitted when the grant carries no
            capabilities.
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityConstraint"
          description: >
            Typed runtime constraints that narrow the grant on every
            request. Empty / omitted when the grant has no
            constraints.

    AuthorityCapability:
      type: string
      description: >
        One of the five canonical capabilities an AuthorityGrant may
        authorise. The set is fixed; new capability values require a
        domain change. Stop is intentionally a CAPABILITY VALUE — it
        is enforced by the orchestrator the same way as the other
        four (the grant must explicitly carry "stop" for the agent
        to invoke a stop action).
      enum:
        - recommend
        - approve
        - reject
        - escalate
        - stop

    AuthorityConstraintKind:
      type: string
      description: >
        Discriminator for the AuthorityConstraint value object. Each
        kind populates exactly the fields relevant to its variant:


        - confidence_threshold_min:  uses min_confidence

        - consequence_threshold_max: uses max_consequence

        - human_only / ai_only:      no payload fields

        - time_window:               uses start_time + end_time
      enum:
        - confidence_threshold_min
        - consequence_threshold_max
        - human_only
        - ai_only
        - time_window

    AuthorityConstraint:
      type: object
      description: >
        One typed runtime constraint attached to an AuthorityGrant.
        The orchestrator evaluates each constraint on every request;
        the first violation rejects with reason_code
        CONSTRAINT_VIOLATED and emits an AUTHORITY_CONSTRAINT_VIOLATED
        audit event.
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/AuthorityConstraintKind"
        min_confidence:
          type: number
          description: >
            confidence_threshold_min variant: minimum allowed
            request.confidence (in [0,1]).
        max_consequence:
          $ref: "#/components/schemas/AuthorityGraphConsequenceThreshold"
        start_time:
          type: string
          format: date-time
          description: >
            time_window variant: inclusive lower bound of the
            permitted window.
        end_time:
          type: string
          format: date-time
          description: >
            time_window variant: exclusive upper bound of the
            permitted window.

    AuthorityGraphAgentData:
      type: object
      description: >
        Typed data for an agent node. Agent.Endpoint is intentionally
        not exposed via the graph — it is an internal URL not
        appropriate for a read-only projection.
      required:
        - id
        - name
        - type
        - operational_state
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: One of "ai", "service", or "operator".
        owner:
          type: string
        model_version:
          type: string
        operational_state:
          type: string

    AuthorityGraphRuleCountByClass:
      type: object
      description: >
        Per-correctness-class rule count summary for a FailModePolicy.
        All five CorrectnessClass values are present, defaulting to
        zero. Provides at-a-glance coverage without pushing the full
        rules array into the graph payload.
      required:
        - governance_integrity
        - persistence
        - input
        - resource
        - consistency
      properties:
        governance_integrity:
          type: integer
        persistence:
          type: integer
        input:
          type: integer
        resource:
          type: integer
        consistency:
          type: integer

    AuthorityGraphFailModePolicyData:
      type: object
      description: >
        Typed data for a fail_mode_policy node. Carries identity,
        lifecycle, and ownership; the full Rules array is omitted
        (operator-noisy) but the per-class rule count is exposed so
        operators see coverage at a glance.
      required:
        - id
        - version
        - name
        - status
        - managed
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        status:
          type: string
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          description: >
            Validity-window upper bound. Policy version is no longer
            active at or after this instant.
        business_owner:
          type: string
        technical_owner:
          type: string
        origin:
          type: string
        managed:
          type: boolean
        rule_count_by_class:
          $ref: "#/components/schemas/AuthorityGraphRuleCountByClass"

    AuthorityGraphEscalationTargetData:
      type: object
      description: >
        Typed data for an escalation_target node (D31l). Mirrors the
        escalation.EscalationTarget domain fields the graph projects
        as a read model. The escalation context owns the authoritative
        EscalationTarget schema under /v1/escalation_targets; this is
        the graph-specific projection.
      required:
        - id
        - version
        - name
        - kind
        - handle
        - status
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: >
            One of role / agent / surface / external. The canonical
            enum lives on EscalationTargetKind under the escalation
            HTTP API; the Authority Graph emits the value verbatim.
        handle:
          type: string
          description: >
            Kind-specific identifier. For role, the role name; for
            agent, the agent id; for surface, the surface id; for
            external, the external system/URI identifier.
        status:
          type: string
          description: One of draft / review / active / deprecated / retired.
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
        business_owner:
          type: string
        technical_owner:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time

    AuthorityGraphExternalRefData:
      type: object
      description: >
        Optional external reference for a business service node.
        Mirrors the externalref domain type. Field set matches
        ContextGraphExternalRefData but is kept as a sibling so the
        Authority Graph schema family stays self-contained.
      properties:
        source_system:
          type: string
        source_id:
          type: string
        source_url:
          type: string
        source_version:
          type: string
        last_synced_at:
          type: string

    # ------------------------------------------------------------------
    # AI System Registration (Epic 1, PR 2)
    # ------------------------------------------------------------------

    AISystem:
      type: object
      description: >
        AI System registry entry. Identity-only; risk classification and
        external references are deferred to follow-up epics. Status is
        honoured at apply time (no review-forcing).
      required:
        - id
        - name
        - status
        - origin
        - managed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Logical AI system identifier.
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        vendor:
          type: string
        system_type:
          type: string
          description: Free-form classifier (e.g. "llm", "classifier").
        status:
          type: string
          enum: [active, deprecated, retired]
        origin:
          type: string
          enum: [manual, inferred]
        managed:
          type: boolean
        replaces:
          type: string
          nullable: true
          description: Logical ID of the AI system this one supersedes, if any.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: Optional structured external reference. See ExternalRef (Epic 1, PR 3).

    AISystemsResponse:
      type: object
      description: >
        Top-level response shape for GET /v1/aisystems. The `ai_systems`
        array is always present (never null).
      required: [ai_systems]
      properties:
        ai_systems:
          type: array
          items:
            $ref: "#/components/schemas/AISystem"

    AISystemVersion:
      type: object
      description: >
        Versioned snapshot of an AISystem. Identified by composite
        (ai_system_id, version). Status is honoured at apply time.
      required:
        - ai_system_id
        - version
        - status
        - effective_from
        - compliance_frameworks
        - created_at
        - updated_at
      properties:
        ai_system_id:
          type: string
        version:
          type: integer
          minimum: 1
        release_label:
          type: string
        model_artifact:
          type: string
        model_hash:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [review, active, deprecated, retired]
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true
        compliance_frameworks:
          type: array
          items:
            type: string
        documentation_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: Optional structured external reference. See ExternalRef (Epic 1, PR 3).

    AISystemVersionsResponse:
      type: object
      description: >
        Top-level response shape for
        GET /v1/aisystems/{id}/versions. The `versions` array is always
        present (never null).
      required: [ai_system_id, versions]
      properties:
        ai_system_id:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/AISystemVersion"

    AISystemBinding:
      type: object
      description: >
        Immediate-apply junction linking an AI system (optionally pinned
        to a specific version) to one or more existing MIDAS context
        entities (BusinessService, Capability, Process, DecisionSurface).
        At least one of business_service_id, capability_id, process_id,
        or surface_id is set; unset fields are returned as JSON null
        rather than empty strings.
      required:
        - id
        - ai_system_id
        - created_at
      properties:
        id:
          type: string
        ai_system_id:
          type: string
        ai_system_version:
          type: integer
          nullable: true
          minimum: 1
        business_service_id:
          type: string
          nullable: true
        capability_id:
          type: string
          nullable: true
        process_id:
          type: string
          nullable: true
        surface_id:
          type: string
          nullable: true
        role:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        external_ref:
          allOf:
            - $ref: "#/components/schemas/ExternalRef"
          nullable: true
          description: Optional structured external reference. See ExternalRef (Epic 1, PR 3).

    AISystemBindingsResponse:
      type: object
      description: >
        Top-level response shape for GET /v1/aisystems/{id}/bindings.
        The `bindings` array is always present (never null).
      required: [ai_system_id, bindings]
      properties:
        ai_system_id:
          type: string
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/AISystemBinding"

    AdminAuditDetails:
      type: object
      description: >
        Action-specific structured context. All fields are optional and present
        only when the emitting action populated them. Never carries secret
        material.
      properties:
        bundle_bytes:
          type: integer
        created_count:
          type: integer
        conflict_count:
          type: integer
        unchanged_count:
          type: integer
        error_count:
          type: integer
        from_capability_id:
          type: string
        from_process_id:
          type: string
        to_capability_id:
          type: string
        to_process_id:
          type: string
        surfaces_migrated:
          type: integer
        older_than_days:
          type: integer
        processes_deleted:
          type: array
          items:
            type: string
        capabilities_deleted:
          type: array
          items:
            type: string
        error:
          type: string
          description: Human-readable failure message; never secret.

    AdminAuditEntry:
      type: object
      required: [id, occurred_at, action, outcome, actor_type]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
          enum:
            - apply.invoked
            - password.changed
            - bootstrap.admin_created
        outcome:
          type: string
          enum: [success, failure]
        actor_type:
          type: string
          enum: [user, system]
        actor_id:
          type: string
          description: Principal ID or system identifier. Omitted when unknown.
        target_type:
          type: string
          description: Open-set target kind (e.g. bundle, user, platform, process). Omitted when unset.
        target_id:
          type: string
          description: Resource identifier. Omitted when unset.
        request_id:
          type: string
          description: HTTP request correlation ID. Omitted for non-HTTP events.
        client_ip:
          type: string
          description: Best-effort client IP. Omitted for non-HTTP events.
        required_permission:
          type: string
          description: Authz permission the request was gated on. Omitted for non-permission-gated events.
        details:
          $ref: "#/components/schemas/AdminAuditDetails"

    AdminAuditListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditEntry"

    SurfaceVersionItem:
      type: object
      description: A single entry in the surface version history list.
      properties:
        version:
          type: integer
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        effective_from:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SurfaceImpact:
      type: object
      description: >
        Full dependency graph for a decision surface — all linked profiles, grants,
        and distinct agents. All array sections are always present (never null).
        Warnings are deterministic based on active-count thresholds.
      properties:
        surface:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            status:
              type: string
            version:
              type: integer
            domain:
              type: string
            business_owner:
              type: string
            technical_owner:
              type: string
            approved_by:
              type: string
            approved_at:
              type: string
              format: date-time
              nullable: true
            deprecation_reason:
              type: string
            successor_surface_id:
              type: string
        profiles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
              version:
                type: integer
              policy_reference:
                type: string
              fail_mode:
                type: string
                enum: [open, closed]
                description: >
                  Narrow runtime fail-mode for the policy-evaluator-error
                  sub-case on this profile. The only currently runtime-
                  effective fail-mode field; see the AuthorityProfile schema
                  description for full semantics and the audit-payload
                  caveat.
              escalation_mode:
                type: string
                enum: [auto, manual]
        grants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              agent_id:
                type: string
              profile_id:
                type: string
              status:
                type: string
              granted_by:
                type: string
              effective_from:
                type: string
                format: date-time
              effective_until:
                type: string
                format: date-time
                nullable: true
        agents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
              owner:
                type: string
              operational_state:
                type: string
                enum: [active, suspended, revoked]
        summary:
          type: object
          properties:
            profile_count:
              type: integer
            grant_count:
              type: integer
            agent_count:
              type: integer
            active_profile_count:
              type: integer
            active_grant_count:
              type: integer
            active_agent_count:
              type: integer
        warnings:
          type: array
          items:
            type: string
          description: Operator warnings. Empty array when none apply.

    SurfaceRecovery:
      type: object
      description: Read-only recovery analysis for a decision surface.
      properties:
        surface_id:
          type: string
        latest_version:
          type: integer
        latest_status:
          type: string
        active_version:
          type: integer
          nullable: true
          description: Null when no version is currently effective.
        active_status:
          type: string
          nullable: true
          description: Null when no version is currently effective.
        successor_surface_id:
          type: string
        deprecation_reason:
          type: string
        version_count:
          type: integer
        warnings:
          type: array
          items:
            type: string
        recommended_next_actions:
          type: array
          items:
            type: string

    ProfileRecovery:
      type: object
      description: Read-only recovery analysis for an authority profile.
      properties:
        profile_id:
          type: string
        surface_id:
          type: string
        latest_version:
          type: integer
        latest_status:
          type: string
        active_version:
          type: integer
          nullable: true
          description: Null when no version is currently effective.
        active_status:
          type: string
          nullable: true
          description: Null when no version is currently effective.
        version_count:
          type: integer
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: integer
              status:
                type: string
              effective_from:
                type: string
                format: date-time
        active_grant_count:
          type: integer
          description: >
            Number of active grants linked to this profile.
            -1 when the grant repository is not available.
        capability_note:
          type: string
          description: Human-readable description of the profile lifecycle behaviour.
        warnings:
          type: array
          items:
            type: string
        recommended_next_actions:
          type: array
          items:
            type: string

    # ---------------------------------------------------------------
    # Drift (Drift-1d read APIs)
    # ---------------------------------------------------------------
    DriftType:
      type: string
      description: >
        V1 drift taxonomy. Population, data, prediction, performance,
        and concept drift are deferred to V2 and MUST NOT appear here.
      enum:
        - invocation
        - outcome
        - confidence
        - latency
        - evidence
        - authority
        - policy
        - coverage
        - process_path

    DriftDefinitionStatus:
      description: >
        Lifecycle state of a DriftDefinition. Delegates to the
        canonical LifecycleStatus posture.
      allOf:
        - $ref: "#/components/schemas/LifecycleStatus"

    DriftStatusBand:
      type: string
      description: >
        Five-band status used by DriftSeries, DriftSeriesPoint, and
        DriftObservation.detector_status. The split into
        unknown_insufficient_data and unknown_detector_error is
        deliberate; there is no single 'unknown' value.
      enum:
        - healthy
        - warning
        - breached
        - unknown_insufficient_data
        - unknown_detector_error

    DriftPointComputationMode:
      type: string
      description: >
        Computation provenance for a series point. Backfill state lives
        on this enum; it is not encoded on detector_status.
      enum:
        - realtime
        - backfilled
        - corrected
        - imported

    DriftObservationOperatorStatus:
      type: string
      enum:
        - open
        - triaged
        - resolved
        - accepted
        - superseded

    DriftAnnotationStatus:
      type: string
      enum:
        - active
        - superseded

    DriftAnnotationTargetKind:
      type: string
      enum:
        - series
        - observation

    DriftAnnotationType:
      type: string
      enum:
        - known_business_change
        - suppression
        - remediation_note
        - acknowledgement

    DriftBaselineStrategy:
      type: string
      description: >
        V1 baseline strategies. champion_challenger and
        seasonality_aware are deferred to V2 and MUST NOT appear here.
      enum:
        - rolling
        - fixed_governed
        - previous_equivalent
        - since_last_governed_change
        - manually_pinned

    DriftCadence:
      type: string
      enum:
        - minute
        - hour
        - day
        - week

    DriftOrigin:
      type: string
      enum:
        - manual
        - inferred
        - auto_instrumented

    DriftTargetEntityKind:
      type: string
      description: >
        The nine governed entity kinds a DriftDefinition may target.
      enum:
        - business_service
        - capability
        - process
        - decision_surface
        - ai_system
        - ai_system_binding
        - agent
        - authority_profile
        - authority_grant

    DriftThresholdDirection:
      type: string
      enum:
        - ascending
        - descending

    DriftTargetRef:
      type: object
      description: Discriminated reference to a governed entity.
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/DriftTargetEntityKind"
        id:
          type: string

    DriftMetricDefinition:
      type: object
      description: Embedded metric inside a DriftDefinition revision.
      required:
        - metric_id
        - drift_type
        - baseline_strategy
        - window_seconds
        - cadence
        - threshold_direction
        - warning_threshold
        - breached_threshold
      properties:
        metric_id:
          type: string
        drift_type:
          $ref: "#/components/schemas/DriftType"
        baseline_strategy:
          $ref: "#/components/schemas/DriftBaselineStrategy"
        baseline_window_seconds:
          type: integer
          minimum: 0
        window_seconds:
          type: integer
          minimum: 1
        cadence:
          $ref: "#/components/schemas/DriftCadence"
        warning_threshold:
          type: number
        breached_threshold:
          type: number
        threshold_direction:
          $ref: "#/components/schemas/DriftThresholdDirection"
        governance_expectation_ref:
          type: string
        governance_expectation_ver:
          type: integer
          minimum: 0
        description:
          type: string

    DriftDefinition:
      type: object
      description: >
        Governed, versioned drift specification. Composite (id, version)
        identity. Apply persists Status='review'; activation lives in a
        future approval-endpoint tranche.
      required:
        - id
        - version
        - name
        - status
        - effective_date
        - business_owner
        - technical_owner
        - target
        - metrics
        - origin
        - managed
        - created_at
        - updated_at
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/DriftDefinitionStatus"
        effective_date:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true
        business_owner:
          type: string
        technical_owner:
          type: string
        target:
          $ref: "#/components/schemas/DriftTargetRef"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DriftMetricDefinition"
        origin:
          $ref: "#/components/schemas/DriftOrigin"
        managed:
          type: boolean
        replaces:
          type: string
        successor_definition_id:
          type: string
        successor_version:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
          nullable: true

    DriftDefinitionListResponse:
      type: object
      required: [drift_definitions]
      properties:
        drift_definitions:
          type: array
          items:
            $ref: "#/components/schemas/DriftDefinition"

    DriftSeries:
      type: object
      description: One time-ordered stream for a (definition revision, metric, cadence) tuple.
      required:
        - id
        - definition_id
        - definition_version
        - metric_id
        - cadence
        - status
        - continuity_group_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        definition_id:
          type: string
        definition_version:
          type: integer
          minimum: 1
        metric_id:
          type: string
        cadence:
          $ref: "#/components/schemas/DriftCadence"
        status:
          $ref: "#/components/schemas/DriftStatusBand"
        continuity_group_id:
          type: string
        previous_series_id:
          type: string
        superseded_by_series_id:
          type: string
        cutover_at:
          type: string
          format: date-time
          nullable: true
        sealed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriftSeriesListResponse:
      type: object
      required: [drift_series]
      properties:
        drift_series:
          type: array
          items:
            $ref: "#/components/schemas/DriftSeries"

    DriftSeriesPoint:
      type: object
      description: >
        Append-only window summary. summary_stats and baseline_stats
        are opaque JSON objects whose internal shape is detector-
        specific. Backfill state is encoded on computation_mode +
        backfill_run_id, NOT on status.
      required:
        - id
        - series_id
        - window_start
        - window_end
        - sample_count
        - summary_stats
        - baseline_stats
        - magnitude
        - status
        - computation_mode
        - computed_at
        - source_window_complete
        - provenance_envelope_ids
        - created_at
      properties:
        id:
          type: string
        series_id:
          type: string
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        sample_count:
          type: integer
          minimum: 0
        summary_stats:
          type: object
          description: Detector-specific summary stats; opaque object whose internal shape is detector-specific.
          additionalProperties: true
        baseline_stats:
          type: object
          description: Detector-specific baseline stats; opaque object whose internal shape is detector-specific.
          additionalProperties: true
        baseline_window_id:
          type: string
        magnitude:
          type: number
        status:
          $ref: "#/components/schemas/DriftStatusBand"
        computation_mode:
          $ref: "#/components/schemas/DriftPointComputationMode"
        computed_at:
          type: string
          format: date-time
        backfill_run_id:
          type: string
        source_window_complete:
          type: boolean
        provenance_envelope_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    DriftSeriesPointListResponse:
      type: object
      required: [drift_series_points]
      properties:
        drift_series_points:
          type: array
          items:
            $ref: "#/components/schemas/DriftSeriesPoint"

    DriftObservation:
      type: object
      description: >
        Audit-chain-bearing detector result. The observation itself
        does not mutate runtime state; future FailModePolicy resolvers
        may consume it as evidence input.
      required:
        - id
        - definition_id
        - definition_version
        - series_id
        - point_id
        - target
        - drift_type
        - magnitude
        - detector_status
        - operator_status
        - observed_window_start
        - observed_window_end
        - detected_at
        - emitted_at
        - backfilled
        - evidence_envelope_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        definition_id:
          type: string
        definition_version:
          type: integer
          minimum: 1
        series_id:
          type: string
        point_id:
          type: string
        target:
          $ref: "#/components/schemas/DriftTargetRef"
        drift_type:
          $ref: "#/components/schemas/DriftType"
        magnitude:
          type: number
        detector_status:
          $ref: "#/components/schemas/DriftStatusBand"
        operator_status:
          $ref: "#/components/schemas/DriftObservationOperatorStatus"
        baseline_window_id:
          type: string
        observed_window_start:
          type: string
          format: date-time
        observed_window_end:
          type: string
          format: date-time
        detected_at:
          type: string
          format: date-time
        emitted_at:
          type: string
          format: date-time
        backfilled:
          type: boolean
        backfill_run_id:
          type: string
        evidence_envelope_ids:
          type: array
          items:
            type: string
        related_fail_mode_policy_id:
          type: string
        related_governance_exp_ref:
          type: string
        correction_of:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriftObservationListResponse:
      type: object
      required: [drift_observations]
      properties:
        drift_observations:
          type: array
          items:
            $ref: "#/components/schemas/DriftObservation"

    DriftAnnotationTargetRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/DriftAnnotationTargetKind"
        id:
          type: string

    DriftAnnotation:
      type: object
      description: Operator commentary against a series or observation.
      required:
        - id
        - target
        - annotation_type
        - body
        - reference_envelope_ids
        - status
        - author_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        target:
          $ref: "#/components/schemas/DriftAnnotationTargetRef"
        annotation_type:
          $ref: "#/components/schemas/DriftAnnotationType"
        body:
          type: string
        suppression_until:
          type: string
          format: date-time
          nullable: true
        reference_envelope_ids:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/DriftAnnotationStatus"
        superseded_by_id:
          type: string
        author_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriftAnnotationListResponse:
      type: object
      required: [drift_annotations]
      properties:
        drift_annotations:
          type: array
          items:
            $ref: "#/components/schemas/DriftAnnotation"

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 when the server is running. Does not verify store connectivity.
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: midas
                  policy_mode:
                    type: string
                  policy_evaluator:
                    type: string

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Returns 200 when the server is ready to serve traffic, including store connectivity.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Not ready — store unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/evaluate:
    post:
      operationId: evaluate
      summary: Evaluate a decision request
      description: >
        Evaluates whether an agent is within authority to perform an action on
        a governed decision surface. Produces exactly one outcome and one
        tamper-evident audit envelope. Idempotent by request_id within a source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: Evaluation complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Invalid request (missing required fields, invalid confidence value, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated (auth.mode=required and no valid token provided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.operator or platform.admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/reviews:
    post:
      operationId: createReview
      summary: Resolve an escalated decision
      description: >
        Resolves a pending escalation by approving or rejecting the decision.
        The envelope must be in the awaiting_review state. Transitions the
        envelope to closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.admin or governance.reviewer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/envelopes:
    get:
      operationId: listEnvelopes
      summary: List governance envelopes
      description: Returns all envelopes, optionally filtered by lifecycle state.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [received, evaluating, outcome_recorded, escalated, awaiting_review, closed]
          description: Filter by envelope lifecycle state.
      responses:
        "200":
          description: List of envelopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid state filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/envelopes/{id}:
    get:
      operationId: getEnvelope
      summary: Get a governance envelope by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Envelope found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid envelope ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/escalations:
    get:
      operationId: listEscalations
      summary: List pending escalations
      description: >
        Returns all envelopes in the awaiting_review state — the operator's
        pending escalation queue. Use POST /v1/reviews to resolve them.
      responses:
        "200":
          description: List of escalated envelopes awaiting review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Envelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/decisions/request/{requestId}:
    get:
      operationId: getDecisionByRequestId
      summary: Look up a decision by request ID
      description: >
        Returns the governance envelope for a given caller-supplied request ID.
        Optionally scoped by source system via the source query parameter.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Request source system. Scopes the lookup to a specific origin.
      responses:
        "200":
          description: Envelope found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid request ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/evidence/envelopes/{id}/audit-events:
    get:
      operationId: getEvidenceEnvelopeAuditEvents
      summary: Get the runtime audit-event chain for one envelope
      description: >
        Returns the ordered runtime audit-event chain for one evaluation
        envelope. Events are returned newest-last in SequenceNo
        ascending order — the same order the runtime appended them.
        Payloads are returned as recorded; no redaction is applied.


        This endpoint does NOT return the submitted request payload; use
        GET /v1/envelopes/{id} for envelope details (which includes the
        verbatim submitted JSON under the `submitted.raw` field).


        Read-only. Backed by the production envelope and audit
        repositories. Disjoint from the Explorer audit-events route
        (GET /explorer/envelopes/{id}/audit-events), which uses the
        Explorer-isolated in-memory store and is workbench-only.


        Requires platform.viewer, platform.operator, or platform.admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Envelope ID.
          schema:
            type: string
      responses:
        "200":
          description: Ordered audit-event chain for the envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAuditEventListResponse"
        "400":
          description: Missing or invalid envelope ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Envelope not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Repository error while reading the audit chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Evidence read service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/evidence/envelopes/{id}/integrity:
    get:
      operationId: getEvidenceEnvelopeIntegrity
      summary: Verify the audit-event chain integrity for one envelope
      description: >
        Runs the per-envelope integrity verifier against the
        production audit chain for the specified envelope and returns
        a structured status report. Integrity findings (a broken
        chain) are reported with HTTP 200 and `valid: false` — a
        broken chain is the result being reported, not a transport
        failure. HTTP 500 is reserved for repository / hash-compute
        errors that prevent verification from completing.


        The response does NOT include audit-event payloads, audit-event
        IDs, the envelope's submitted request payload, or the
        envelope's submitted hash. Callers that need that detail use
        GET /v1/evidence/envelopes/{id}/audit-events for the chain or
        GET /v1/envelopes/{id} for envelope detail.


        Requires platform.viewer, platform.operator, or platform.admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Envelope ID.
          schema:
            type: string
      responses:
        "200":
          description: >
            Integrity verification ran to completion. `valid` reports
            the result: true when every check passed; false when an
            integrity finding was reported. On `valid: false`,
            `error_kind` and `error_message` describe the finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeEvidenceIntegrityResponse"
        "400":
          description: Missing or invalid envelope ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Envelope not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Repository or hash-compute error prevented verification from completing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Evidence read service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/evidence/envelopes/{id}/packet:
    get:
      operationId: getEvidenceEnvelopePacket
      summary: Export a decision evidence packet for one envelope
      description: >
        Returns a single decision evidence packet composing the
        existing production reads for one evaluation envelope: the
        envelope object (same shape as GET /v1/envelopes/{id}), the
        ordered audit-event chain (same items as
        GET /v1/evidence/envelopes/{id}/audit-events), and the
        per-envelope integrity verification result (same shape as
        GET /v1/evidence/envelopes/{id}/integrity).


        Integrity findings are reported in-band: a broken audit chain
        produces HTTP 200 with `integrity.valid: false`. Repository or
        verification read failures produce HTTP 500 — the packet is
        never returned partially.


        The envelope sub-object preserves the existing
        /v1/envelopes/{id} contract, including its `submitted.raw`
        field. The packet wrapper itself has no top-level submitted /
        raw / submitted_hash field; D30e adds no redaction mode and
        no query flag toggles that placement.


        Requires platform.viewer, platform.operator, or platform.admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Envelope ID.
          schema:
            type: string
      responses:
        "200":
          description: Packet composed successfully. `integrity.valid` reports the chain status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeEvidencePacket"
        "400":
          description: Missing or invalid envelope ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Envelope not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Repository or verification read failure prevented packet composition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Evidence read service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/evidence/audit-events:
    get:
      operationId: searchEvidenceAuditEvents
      summary: Search runtime audit events across envelopes
      description: >
        Returns runtime audit events matching the supplied filter,
        newest-first by default. Backed by the same audit list
        primitive that powers /v1/coverage and applies the same hard
        upper bound (default page size 100, maximum 500). Cross-envelope
        search complements GET /v1/evidence/envelopes/{id}/audit-events
        (envelope-scoped chain).


        Payloads are returned as recorded; no redaction. This endpoint
        does NOT expose the submitted request payload — use
        GET /v1/envelopes/{id} for envelope details. payload_contains
        and offset / page-number pagination are intentionally not
        exposed; the D30j cursor parameter is the only supported
        pagination mechanism.


        Pagination model (D30j): the response carries an optional
        next_cursor opaque token; clients pass it back verbatim as
        the cursor query parameter to fetch the next page. The
        cursor is bound to the order direction of the originating
        request — replaying a desc cursor against an asc query is
        rejected with 400. Pagination stops when next_cursor is
        absent from the response.


        Requires platform.viewer, platform.operator, or platform.admin.
      parameters:
        - name: event_type
          in: query
          required: false
          description: Single audit event type. event_types wins when both are supplied.
          schema: { type: string }
        - name: event_types
          in: query
          required: false
          description: >
            Comma-separated list of audit event types. Empty tokens
            are rejected with 400. Whitespace around each token is
            trimmed. When non-empty, takes precedence over event_type.
          schema: { type: string }
        - name: envelope_id
          in: query
          required: false
          description: Exact-match filter on envelope_id.
          schema: { type: string }
        - name: request_source
          in: query
          required: false
          description: Exact-match filter on request_source.
          schema: { type: string }
        - name: request_id
          in: query
          required: false
          description: Exact-match filter on request_id.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp; inclusive lower bound on event occurred_at.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: RFC3339 timestamp; exclusive upper bound on event occurred_at. Must not be earlier than since.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: Positive integer in 1..500. Empty applies the audit-list default page size (100). Oversize values are rejected with 400.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: order
          in: query
          required: false
          description: Result ordering by occurred_at. Defaults to desc (newest first).
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          required: false
          description: >
            Opaque pagination token from a prior response's
            next_cursor (D30j). Pass verbatim — clients must not
            decode or modify the token. The cursor is bound to the
            order direction of the originating request; replaying a
            desc cursor against an asc query is rejected with 400.
            A malformed token is rejected with 400.
          schema: { type: string }
      responses:
        "200":
          description: Audit events matching the filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAuditEventSearchResponse"
        "400":
          description: Malformed query parameter (e.g. non-numeric limit, oversize limit, unparseable since/until, until earlier than since, empty event_types token, unknown order value, malformed or order-mismatched cursor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Repository error while reading audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Evidence read service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/controlplane/apply:
    post:
      operationId: applyBundle
      summary: Apply a control-plane configuration bundle
      description: >
        Applies a YAML bundle of surface, profile, grant, and agent documents.
        All resources in the bundle are validated before any are persisted.
        Surfaces are created in review state and must be approved separately.
        Requires platform.admin role.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              description: Multi-document YAML stream of control-plane resources.
      responses:
        "200":
          description: Bundle applied (may contain per-resource validation errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  created:
                    type: integer
                  updated:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        id:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
        "400":
          description: Invalid YAML or bundle-level validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/controlplane/plan:
    post:
      operationId: planBundle
      summary: Preview a control-plane bundle without applying it
      description: >
        Validates and plans a YAML bundle, returning the projected changes
        without persisting anything. Useful for CI/CD dry-run workflows.
        Requires platform.admin role.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Plan computed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  planned:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid YAML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/controlplane/audit:
    get:
      operationId: listControlAudit
      summary: List control-plane audit events
