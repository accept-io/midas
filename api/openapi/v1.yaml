    post:
      operationId: approveDriftDefinition
      summary: Approve a DriftDefinition revision in review state
      description: >
        Transitions a specific DriftDefinition revision from review to
        active. Maker-checker is enforced at the service layer: the
        approver must not equal the revision's `created_by` field
        (case-insensitive trim). Requires governance.approver or
        platform.admin role (permission `drift_definition:approve`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDriftDefinitionRequest"
      responses:
        "200":
          description: DriftDefinition approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDefinition"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission or maker-checker violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: DriftDefinition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DriftDefinition is not in review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Approval service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/controlplane/drift_definitions/{id}/reject:
    post:
      operationId: rejectDriftDefinition
      summary: Reject a DriftDefinition revision back to draft
      description: >
        Transitions a specific DriftDefinition revision from review back
        to draft. Approved_by and approved_at are not modified
        (review-state revisions have neither set). The operator-supplied
        reason is captured in the control-audit record only. Requires
        governance.approver or platform.admin role (permission
        `drift_definition:reject`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDriftDefinitionRequest"
      responses:
        "200":
          description: DriftDefinition transitioned to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDefinition"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission (requires drift_definition:reject)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: DriftDefinition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DriftDefinition is not in review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Approval service not configured
          content:
            application/json:
              schema:
