          required: true
          schema:
            type: string
        - name: from_window
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on window_start; RFC3339.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
