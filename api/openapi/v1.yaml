    post:
      operationId: rejectDriftDefinition
      summary: Reject a DriftDefinition revision back to draft
      description: >
        Transitions a specific DriftDefinition revision from review back
        to draft. Approved_by and approved_at are not modified
        (review-state revisions have neither set). The operator-supplied
        reason is captured in the control-audit record only. Requires
        governance.approver or platform.admin role (permission
        `drift_definition:reject`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
