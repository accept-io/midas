  # D31f — graphs family taxonomy. Context Graph and Authority Graph
  # are both implemented. Knowledge Graph remains reserved:
  #
  #   /v1/graphs/context     implemented (D31d)
  #   /v1/graphs/authority   implemented (D31f)
  #   /v1/graphs/knowledge   future Knowledge Graph (not implemented;
  #                          no handler, no schema, no path entry)
  #
  # The Context Graph (D31d) replaced the prior /v1/authority-graph
  # (which was misleadingly named — it always returned a context-
  # flavoured projection) and the /v1/businessservices/{id}/governance-map
  # endpoint (a functional duplicate of view=service).
  #
  # The Authority Graph (D31f) projects the authority spine — business
  # service → decision surface → authority profile → authority grant →
  # agent — plus fail-mode-policy edges. It has its own AuthorityGraph*
  # schema family (no reuse from ContextGraph*).

  /v1/graphs/context:
    get:
      operationId: getContextGraph
      summary: Project a depth-bounded Context Graph rooted at an entity
      description: >
        Returns a generic node/edge projection of business and
        operational context rooted at the entity identified by
        (view, id). Supported views: `service` (rooted at a
        BusinessService), `ai_system` (rooted at an AI system),
        `decision_surface` (rooted at a surface).

        Node kinds:
        business_service, related_business_service, capability, process,
        decision_surface, ai_system, ai_system_binding, authority_summary,
        coverage.

        Edge kinds (all directed):
        relates_to, has_capability, has_process, has_surface, bound_to
        (ai_system_binding to most-specific scope), system_of
        (ai_system_binding to ai_system), summarises, reports_coverage.

        The `depth` parameter is interpreted as undirected BFS hops
        from the root. Default is 3; values above 5 are silently
        clamped to 5. Per-entity authority detail (authority_profile,
        authority_grant, agent, fail_mode_policy) is intentionally
        absent from the Context Graph and will be first-class on the
        future /v1/graphs/authority endpoint.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [service, ai_system, decision_surface]
          description: >
            Perspective. `service` is rooted at a business service.
            `ai_system` is rooted at an AI system and walks bindings to
            their scope targets. `decision_surface` is rooted at a
            surface and emits parent process / business service plus
            AI systems bound directly to the surface.
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: >
            Root entity id. For view=service this is the
            business_service id.
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 3
          description: >
            Maximum BFS hops from the root, treating edges as
            undirected. Values above 5 are silently clamped to 5;
            negative or non-numeric values return 400.
      responses:
        "200":
          description: Context Graph projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextGraphProjection"
        "400":
          description: Invalid view, id, or depth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Root entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Wrong HTTP method (only GET allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Context graph projection service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/graphs/authority:
    get:
      operationId: getAuthorityGraph
      summary: Project a depth-bounded Authority Graph rooted at a business service
      description: >
        Returns a generic node/edge projection of the authority spine
        rooted at a business service. Answers the operator question:
        "for this business service, which decision surfaces are
        governed by which authority profiles, which grants, which
        agents, and which fail-mode policies?"

        Node kinds (7):
        business_service, decision_surface, authority_profile,
        authority_grant, agent, fail_mode_policy, escalation_target.

        Edge kinds (7, all directed):
        business_service_has_surface (bs → surface),
        surface_uses_profile (surface → profile),
        profile_has_grant (profile → grant),
        grant_authorises_agent (grant → agent),
        surface_has_fail_mode_policy (surface → policy, label="override"),
        business_service_has_fail_mode_policy (bs → policy, label="default"),
        profile_escalates_to (profile → escalation_target).

        Process nodes are intentionally not projected — the BS →
        Surface relationship is collapsed into a single edge.
        The Surface node's typed data carries process_id for
        traceability.

        Fail-mode policies are resolved at request time via the
        FailModePolicies repository's active-version lookup; missing
        active versions are skipped defensively without emitting a
        warning.

        The `depth` parameter is interpreted as undirected BFS hops
        from the root. Default is 4 (one higher than the Context
        Graph's 3) so the default view reaches agent nodes at the
        end of the BS → Surface → Profile → Grant → Agent chain.
        Values above 5 are silently clamped to 5.

        MVP supports view=service only. Per-entity views (agent,
        surface) are reserved for later tranches.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [service]
          description: >
            Perspective. Only `service` is supported at MVP — root
            at a business service and walk the authority spine.
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: >
            Root entity id. For view=service this is the
            business_service id.
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 4
          description: >
            Maximum BFS hops from the root, treating edges as
            undirected. Default 4 reaches agent nodes. Values above
            5 are silently clamped to 5; negative or non-numeric
            values return 400.
      responses:
        "200":
          description: Authority Graph projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityGraphProjection"
              examples:
                healthy_authority_graph:
                  summary: Healthy authority graph with no diagnostics
                  description: >
                    Single business service with one surface, one
                    profile, one grant, one active agent, and a
                    resolved escalation target. No diagnostics → all
                    rollup counters are zero; surface posture reports
                    authority_status=complete and highest_severity=none.
                  value:
                    root:
                      kind: business_service
                      id: bs-1
                    view: service
                    depth: 4
                    nodes:
                      - kind: business_service
                        id: bs-1
                        label: BS One
                      - kind: decision_surface
                        id: surf-1
                        label: Surface One
                      - kind: authority_profile
                        id: prof-1
                        label: Profile One
                      - kind: authority_grant
                        id: grant-1
                        label: grant-1
                      - kind: agent
                        id: agent-1
                        label: Agent One
                      - kind: escalation_target
                        id: et-1
                        label: Governance Approver
                    edges:
                      - kind: business_service_has_surface
                        src: {kind: business_service, id: bs-1}
                        dst: {kind: decision_surface, id: surf-1}
                      - kind: surface_uses_profile
                        src: {kind: decision_surface, id: surf-1}
                        dst: {kind: authority_profile, id: prof-1}
                      - kind: profile_has_grant
                        src: {kind: authority_profile, id: prof-1}
                        dst: {kind: authority_grant, id: grant-1}
                      - kind: grant_authorises_agent
                        src: {kind: authority_grant, id: grant-1}
                        dst: {kind: agent, id: agent-1}
                      - kind: profile_escalates_to
                        src: {kind: authority_profile, id: prof-1}
                        dst: {kind: escalation_target, id: et-1}
                    summary:
                      surface_count: 1
                      active_profile_count: 1
                      active_grant_count: 1
                      active_agent_count: 1
                      fail_mode_policy_count: 0
                      complete_authority_paths: 1
                      incomplete_authority_paths: 0
                      surfaces_with_policy_override: 0
                      surfaces_inheriting_bs_policy: 0
                      grants_with_stop_capability: 0
                      grants_with_constraints: 0
                      escalation_target_count: 1
                      profiles_with_escalation_target: 1
                    diagnostics: []
                    diagnostic_summary:
                      info: 0
                      warning: 0
                      critical: 0
                      highest_severity: none
                    surface_posture:
                      - surface: {kind: decision_surface, id: surf-1}
                        authority_status: complete
                        profile_status: covered
                        grant_status: covered
                        agent_status: covered
                        fail_mode_policy_status: missing
                        escalation_status: targeted
                        complete_paths: 1
                        incomplete_paths: 0
                        highest_severity: none

                mixed_diagnostics_authority_graph:
                  summary: Authority graph with both warning and critical diagnostics
                  description: >
                    A surface with an inactive agent (critical) and a
                    grant carrying no capabilities (warning). The
                    rollup highest_severity is critical and the
                    affected surface posture reports
                    authority_status=degraded.
                  value:
                    root:
                      kind: business_service
                      id: bs-1
                    view: service
                    depth: 4
                    nodes:
                      - kind: business_service
                        id: bs-1
                        label: BS One
                      - kind: decision_surface
                        id: surf-1
                        label: Surface One
                      - kind: authority_profile
                        id: prof-1
                        label: Profile One
                      - kind: authority_grant
                        id: grant-1
                        label: grant-1
                      - kind: agent
                        id: agent-1
                        label: Suspended Agent
                    edges:
                      - kind: business_service_has_surface
                        src: {kind: business_service, id: bs-1}
                        dst: {kind: decision_surface, id: surf-1}
                      - kind: surface_uses_profile
                        src: {kind: decision_surface, id: surf-1}
                        dst: {kind: authority_profile, id: prof-1}
                      - kind: profile_has_grant
                        src: {kind: authority_profile, id: prof-1}
                        dst: {kind: authority_grant, id: grant-1}
                      - kind: grant_authorises_agent
                        src: {kind: authority_grant, id: grant-1}
                        dst: {kind: agent, id: agent-1}
                    summary:
                      surface_count: 1
                      active_profile_count: 1
                      active_grant_count: 1
                      active_agent_count: 1
                      fail_mode_policy_count: 0
                      complete_authority_paths: 1
                      incomplete_authority_paths: 0
                      surfaces_with_policy_override: 0
                      surfaces_inheriting_bs_policy: 0
                      grants_with_stop_capability: 0
                      grants_with_constraints: 0
                      escalation_target_count: 0
                      profiles_with_escalation_target: 0
                    diagnostics:
                      - kind: grant_references_inactive_agent
                        severity: critical
                        node_refs:
                          - {kind: authority_grant, id: grant-1}
                          - {kind: agent, id: agent-1}
                        message: 'grant "grant-1" references agent "agent-1" whose operational_state is "suspended"; runtime authority will be blocked'
                      - kind: grant_has_no_capabilities
                        severity: warning
                        node_refs:
                          - {kind: authority_grant, id: grant-1}
                        message: 'authority grant "grant-1" carries no capabilities — orchestrator capability checks against it always reject'
                      - kind: profile_has_no_escalation_target
                        severity: info
                        node_refs:
                          - {kind: authority_profile, id: prof-1}
                        message: 'authority profile "prof-1" has no explicit escalation target; escalation will preserve the current outcome without target routing'
                    diagnostic_summary:
                      info: 1
                      warning: 1
                      critical: 1
                      highest_severity: critical
                      by_kind:
                        grant_references_inactive_agent: 1
                        grant_has_no_capabilities: 1
                        profile_has_no_escalation_target: 1
                    surface_posture:
                      - surface: {kind: decision_surface, id: surf-1}
                        authority_status: degraded
                        profile_status: covered
                        grant_status: covered
                        agent_status: blocked
                        fail_mode_policy_status: missing
                        escalation_status: not_targeted
                        complete_paths: 1
                        incomplete_paths: 0
                        highest_severity: critical
                        diagnostic_kinds:
                          - grant_has_no_capabilities
                          - grant_references_inactive_agent
                          - profile_has_no_escalation_target

                dangling_escalation_target_authority_graph:
                  summary: Authority graph with a dangling escalation target reference
                  description: >
                    A profile references an EscalationTarget id that
                    does not resolve to an active version. No
                    escalation_target node is emitted (no active
                    target exists); the surface posture reports
                    escalation_status=dangling and the rollup carries
                    one warning.
                  value:
                    root:
                      kind: business_service
                      id: bs-1
                    view: service
                    depth: 4
                    nodes:
                      - kind: business_service
                        id: bs-1
                        label: BS One
                      - kind: decision_surface
                        id: surf-1
                        label: Surface One
                      - kind: authority_profile
                        id: prof-1
                        label: Profile One
                      - kind: authority_grant
                        id: grant-1
                        label: grant-1
                      - kind: agent
                        id: agent-1
                        label: Agent One
                    edges:
                      - kind: business_service_has_surface
                        src: {kind: business_service, id: bs-1}
                        dst: {kind: decision_surface, id: surf-1}
                      - kind: surface_uses_profile
                        src: {kind: decision_surface, id: surf-1}
                        dst: {kind: authority_profile, id: prof-1}
                      - kind: profile_has_grant
                        src: {kind: authority_profile, id: prof-1}
                        dst: {kind: authority_grant, id: grant-1}
                      - kind: grant_authorises_agent
                        src: {kind: authority_grant, id: grant-1}
                        dst: {kind: agent, id: agent-1}
                    summary:
                      surface_count: 1
                      active_profile_count: 1
                      active_grant_count: 1
                      active_agent_count: 1
                      fail_mode_policy_count: 0
                      complete_authority_paths: 1
                      incomplete_authority_paths: 0
                      surfaces_with_policy_override: 0
                      surfaces_inheriting_bs_policy: 0
                      grants_with_stop_capability: 0
                      grants_with_constraints: 0
                      escalation_target_count: 0
                      profiles_with_escalation_target: 0
                      profiles_with_dangling_escalation_target:
                        - {kind: authority_profile, id: prof-1}
                    diagnostics:
                      - kind: escalation_target_reference_dangling
                        severity: warning
                        node_refs:
                          - {kind: authority_profile, id: prof-1}
                          - {kind: escalation_target, id: et-missing}
                        message: 'authority profile "prof-1" references escalation target "et-missing", but no active version is available'
                    diagnostic_summary:
                      info: 0
                      warning: 1
                      critical: 0
                      highest_severity: warning
                      by_kind:
                        escalation_target_reference_dangling: 1
                    surface_posture:
                      - surface: {kind: decision_surface, id: surf-1}
                        authority_status: degraded
                        profile_status: covered
                        grant_status: covered
                        agent_status: covered
                        fail_mode_policy_status: missing
                        escalation_status: dangling
                        complete_paths: 1
                        incomplete_paths: 0
                        highest_severity: warning
                        diagnostic_kinds:
                          - escalation_target_reference_dangling
        "400":
          description: Invalid view, id, or depth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Root business service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Wrong HTTP method (only GET allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Authority graph projection service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/admin-audit:
    get:
      operationId: listAdminAudit
      summary: List platform-administrative audit events
      description: >
        Returns the append-only platform-administrative audit trail covering
        apply invocations, password changes, and bootstrap admin creation.
        Records are returned in descending occurred_at order (newest first).
        Requires platform.admin role — more restrictive than
        /v1/controlplane/audit because the trail includes password and
        bootstrap events. See Issue #41.
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - apply.invoked
              - password.changed
              - bootstrap.admin_created
          description: Constrain results to a single action enum value.
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
          description: Constrain results to success or failure.
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to records emitted for a specific actor.
        - name: target_type
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to a specific target type.
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to a specific target ID.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Cap the number of records returned. Values outside [1, 500] yield 400.
      responses:
        "200":
          description: Admin-audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditListResponse"
        "400":
          description: Invalid query parameter (e.g. non-positive or out-of-range limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limit must be a positive integer
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
