  # -----------------------------------------------------------------
  # FailModePolicy read API (D29d)
  # -----------------------------------------------------------------

  /v1/fail_mode_policies/{id}:
    get:
      operationId: getFailModePolicy
      summary: Get the latest version of a FailModePolicy by ID
      description: >
        Returns the highest-numbered FailModePolicy version for the
        given id regardless of lifecycle status. Read-only; the
        runtime resolver remains evidence-only and rule contents do
        not influence outcome computation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FailModePolicy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailModePolicy"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: FailModePolicy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Repository error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: FailModePolicy reader not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

