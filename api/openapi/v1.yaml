          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDefinition"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission (requires drift_definition:reject)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: DriftDefinition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DriftDefinition is not in review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Approval service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/controlplane/drift_definitions/{id}/deprecate:
    post:
      operationId: deprecateDriftDefinition
      summary: Deprecate an active DriftDefinition revision
      description: >
        Transitions a specific DriftDefinition revision from active to
        deprecated. Successor information is optional; when supplied
        it is persisted on the row's `successor_definition_id` and
        `successor_version` fields. The operator-supplied reason is
        captured in the control-audit record only. Requires
        platform.admin role (permission `drift_definition:deprecate`).
        Cross-version atomic deprecation (auto-deprecate prior active
        when activating a new revision) is intentionally NOT performed
        — operators must call this endpoint explicitly.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeprecateDriftDefinitionRequest"
      responses:
        "200":
          description: DriftDefinition deprecated
          content:
            application/json:
              schema:
