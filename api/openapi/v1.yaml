      summary: List direct child capabilities of a parent capability
      description: >
        Returns the direct children of the parent capability — i.e. the
        capabilities whose `parent_capability_id` equals the path id.
        Recursive descendants are NOT returned; a caller that wants the
        full subtree walks the hierarchy itself. Requires platform.viewer
        or above (Phase 3A).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Parent capability identifier.
      responses:
