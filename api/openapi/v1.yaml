  /v1/surfaces/{id}/recovery:
    get:
      operationId: getSurfaceRecovery
      summary: Get recovery analysis for a decision surface
      description: >
        Returns a read-only recovery analysis: version history state, active/latest
        version distinction, successor links, and deterministic recommended next actions.
