  /v1/authority-graph:
    get:
      operationId: getAuthorityGraph
      summary: Project a depth-bounded authority graph rooted at an entity
      description: >
        Returns a generic node/edge projection of the authority graph
        rooted at the entity identified by (view, id). Phase 1 supports
        only view=service, which projects the same core information as
        GET /v1/businessservices/{id}/governance-map but in a generic
        nodes/edges shape suitable for traversal and depth-bounded
        queries.

        Phase 1 node kinds:
        business_service, related_business_service, capability, process,
        decision_surface, ai_system, ai_system_binding, authority_summary,
        coverage.

        Phase 1 edge kinds (all directed):
        relates_to, has_capability, has_process, has_surface, bound_to
        (ai_system_binding to most-specific scope), system_of
        (ai_system_binding to ai_system), summarises, reports_coverage.

        The `depth` parameter is interpreted as undirected BFS hops
        from the root. Default is 3; values above 5 are silently
        clamped to 5. Forbidden Phase 1 kinds (authority_profile,
        authority_grant, agent, ai_system_version, governed_by,
        has_grant, granted_to, has_active_version) never appear in
        the response — they are reserved for later phases.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [service, ai_system, decision_surface]
          description: >
            Perspective. `service` is rooted at a business service and
            reuses the governance-map read service. `ai_system` is
            rooted at an AI system and walks bindings to their scope
            targets. `decision_surface` is rooted at a surface and
            emits parent process / business service plus AI systems
            bound directly to the surface. Other views (agent, risk)
            are reserved for later phases.
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: >
            Root entity id. For view=service this is the
            business_service id.
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 3
          description: >
            Maximum BFS hops from the root, treating edges as
            undirected. Values above 5 are silently clamped to 5;
            negative or non-numeric values return 400.
      responses:
        "200":
          description: Authority graph projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityGraphProjection"
        "400":
          description: Invalid view, id, or depth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.viewer or above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Root entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Wrong HTTP method (only GET allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Authority graph projection service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform/admin-audit:
    get:
      operationId: listAdminAudit
      summary: List platform-administrative audit events
      description: >
        Returns the append-only platform-administrative audit trail covering
        apply invocations, password changes, and bootstrap admin creation.
        Records are returned in descending occurred_at order (newest first).
        Requires platform.admin role — more restrictive than
        /v1/controlplane/audit because the trail includes password and
        bootstrap events. See Issue #41.
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - apply.invoked
              - password.changed
              - bootstrap.admin_created
          description: Constrain results to a single action enum value.
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
          description: Constrain results to success or failure.
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to records emitted for a specific actor.
        - name: target_type
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to a specific target type.
        - name: target_id
          in: query
          required: false
          schema:
            type: string
          description: Constrain results to a specific target ID.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Cap the number of records returned. Values outside [1, 500] yield 400.
      responses:
        "200":
          description: Admin-audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditListResponse"
        "400":
          description: Invalid query parameter (e.g. non-positive or out-of-range limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limit must be a positive integer
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role (requires platform.admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Admin-audit not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: admin-audit not configured

