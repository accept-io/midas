        service. The map composes the root BusinessService, its directed
        relationships, capabilities, processes, active surfaces, AI
        systems with their active versions and bindings, and authority
        and coverage summary counts.

        Includes only active surfaces (status = 'active'). Includes AI
        systems regardless of status — bindings to deprecated AI systems
        remain visible for audit/compliance review. AI systems are
        included via a four-way OR over bindings to the root BS, its
        capabilities, its processes, or its active surfaces; bindings
        relevant to other business services are excluded per AI system.

        The `recent_decisions` field is intentionally not present in PR 4.
        It will land in PR 8 alongside the OperationalEnvelope changes
        for AI system fields. Requires platform.viewer or above.
        See Epic 1, PR 4 (Service-Centric AI Governance Map read model).
